<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>TAS function</title>
<style>
  :root {
    --bg: #0d0e10; --panel: #131518; --raise: #181b1f; --line: #23262b; --hover: #1d2025;
    --fg: #d9dbde; --dim: #848a93; --faint: #50555d;
    --ok: #6fb39f; --warn: #d0a94f; --bad: #e0745f; --you: #7aa7e0;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--ok); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .dim { color: var(--dim); } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 14px;
           background: var(--bg); border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 700; letter-spacing: .08em; text-decoration: none; color: var(--fg); }
  input { font: inherit; color: var(--fg); background: var(--raise); border: 1px solid var(--line); border-radius: 6px;
          padding: 5px 10px; min-height: 34px; width: min(100%, 320px); }
  button { font: inherit; color: var(--fg); background: var(--raise); border: 1px solid var(--line); border-radius: 6px;
           min-height: 34px; padding: 4px 12px; cursor: pointer; }
  main { max-width: 1000px; margin: 0 auto; padding: 12px 14px 40px; }
  h1 { font: 600 20px var(--mono); margin: 4px 0 8px; overflow-wrap: anywhere; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 18px 0 8px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { display: inline-block; font: 11px/18px var(--mono); padding: 0 8px; border: 1px solid var(--line); border-radius: 9px; color: var(--dim); }
  .badge.ok { color: var(--ok); border-color: #2f5c50; } .badge.bad { color: var(--bad); border-color: #5a2d26; }
  .badge.warn { color: var(--warn); border-color: #5c4a24; } .badge.you { color: var(--you); border-color: #2d4566; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; min-width: 0; }
  .card .head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .card .grow { flex: 1; }
  pre { margin: 8px 0 0; padding: 8px; background: #0a0b0d; border: 1px solid var(--line); border-radius: 6px; overflow: auto;
        font: 12px/1.4 var(--mono); max-height: 360px; }
  pre .add { color: var(--ok); } pre .del { color: var(--bad); } pre .hunk { color: var(--you); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font: 12px var(--mono); }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--dim); font-weight: 600; }
  details > summary { cursor: pointer; color: var(--dim); margin-top: 6px; }
  .empty { color: var(--dim); }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">TAS</a>
  <a href="/#maze">Maze</a>
  <form id="find" style="display:flex;gap:6px;flex:1;min-width:200px"><input id="q" placeholder="function name" autocomplete="off" spellcheck="false"><button>Go</button></form>
</header>
<main id="m"><div class="empty">loading</div></main>
<script>
"use strict";
const $ = id => document.getElementById(id);
function el(tag, cls, ...kids) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const k of kids) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const name = decodeURIComponent(location.pathname.split("/")[2] || "");
$("q").value = name;
$("find").onsubmit = ev => { ev.preventDefault(); const v = $("q").value.trim(); if (v) location.href = "/fn/" + encodeURIComponent(v); };
const badge = (t, c, title) => { const b = el("span", "badge" + (c ? " " + c : ""), t); if (title) b.title = title; return b; };
const VERD = { same: "ok", differs: "bad", untestable: "warn", described: "you" };
const when = t => t ? new Date(t * 1000).toLocaleString() : "?";
function diffBlock(lines) {
  const pre = el("pre");
  for (const l of lines) {
    const c = l.startsWith("@@") ? "hunk" : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
    pre.append(el("span", c, l + "\n"));
  }
  return pre;
}
function val(v) { return v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); }
function casesTable(run) {
  const rows = [...(run.first ? [{ name: run.first.case, difference: run.first, inputs: run.first.inputs, verdict: "differs" }] : []), ...run.cases]
    .filter((r, i, a) => a.findIndex(x => x.name === r.name) === i);
  if (!rows.length) return null;
  const t = el("table"), h = el("tr");
  ["case", "kind", "recomp (original)", "decomp (port/candidate)", "inputs / detail"].forEach(x => h.append(el("th", "", x)));
  t.append(h);
  for (const r of rows) {
    const d = r.difference || {};
    const extra = { ...d }; for (const k of ["kind", "expected", "got", "case", "inputs"]) delete extra[k];
    const inputs = r.inputs || {};
    t.append(el("tr", "", ...[r.name || "", d.kind || r.verdict || "", val(d.expected), val(d.got),
      [Object.entries(inputs).map(([k, v]) => `${k}=${v}`).join(" "), Object.keys(extra).length ? val(extra) : "", r.reason || ""].filter(Boolean).join(" · ")].map(x => el("td", "", x))));
  }
  return el("div", "scroll", t);
}
function runCard(r) {
  const verdictCls = VERD[r.verdict] || "";
  const counts = r.detailed ? `same ${r.same ?? 0} · differs ${r.differs ?? 0} · untestable ${r.untestable ?? 0}` + (r.total ? ` of ${r.total}` : "") : "counts not recorded (run predates detail records)";
  const card = el("div", "card", el("div", "head", badge(r.verdict || "?", verdictCls), badge(r.mode, r.mode === "candidate" ? "you" : ""),
    el("span", "mono", r.lane || ""), el("span", "grow"), el("span", "mono dim", when(r.time))));
  card.append(el("div", "mono dim", counts));
  if (r.reason) card.append(el("div", "mono", r.reason));
  const cases = casesTable(r);
  if (cases) card.append(el("details", "", el("summary", "", "recomp vs decomp values"), cases));
  if (r.source) {
    const s = r.source;
    const label = { diff: "candidate source vs current main C", same: "candidate matches the current main C", gone: "candidate file is gone (not recorded)", "no-main": "main has no C for it (candidate is the first)" }[s.state] || s.state;
    const d = el("details", "", el("summary", "", label + (r.candidate ? " · " + r.candidate : "")));
    if (s.diff) { d.append(diffBlock(s.diff)); if (s.cut) d.append(el("div", "mono dim", `… ${s.cut} more lines`)); if (s.diff.length) d.open = true; }
    card.append(d);
  }
  card.append(el("div", "mono dim", "run " + (r.id || "").slice(0, 12)));
  return card;
}
async function load() {
  if (!name) { $("m").replaceChildren(el("div", "empty", "type a function name above")); return; }
  const r = await fetch("/api/fn/" + encodeURIComponent(name), { cache: "no-store" });
  const d = await r.json();
  const m = $("m"); m.replaceChildren(el("h1", "", name));
  const facts = el("div", "facts");
  if (d.map) {
    facts.append(badge(d.map.state, d.map.state === "exact" ? "ok" : d.map.state === "fuzzy" ? "warn" : "bad", "decomp state"),
      badge(`${d.version} score ${d.map.score}%`, ""), badge(`${d.map.size} bytes`, ""), badge(d.map.file || "no source", ""));
  } else facts.append(badge("not in the " + d.version + " map", "warn"));
  if (d.coverage) {
    const c = d.coverage;
    facts.append(badge(c.port.hit || c.oracle.hit ? "covered by a replay" : "never covered", c.port.hit || c.oracle.hit ? "ok" : "bad"),
      c.oracle.movie ? badge("oracle first: " + c.oracle.movie, "") : null, c.port.movie ? badge("port first: " + c.port.movie, "") : null,
      c.behaviour ? badge("behaviour " + c.behaviour, c.behaviour === "behaves" ? "ok" : "bad") : null);
  }
  m.append(facts);
  m.append(el("div", "mono", el("a", "", "call tree in the maze"), ""));
  m.lastChild.firstChild.href = "/#maze:" + encodeURIComponent(name);
  m.append(el("h2", "", "Claims"));
  m.append(d.claims.length ? el("pre", "", d.claims.join("\n")) : el("div", "empty", "no CLAIMS.md line names it (or the claims file is not mounted)"));
  if (d.main && d.main.text) {
    m.append(el("h2", "", "Current main C · " + d.main.file + (d.main.kind ? " · " + d.main.kind : "")));
    m.append(el("details", "", el("summary", "", "show"), el("pre", "", d.main.text)));
  }
  m.append(el("h2", "", `behave runs (${d.runs_total}${d.runs.length < d.runs_total ? `, newest ${d.runs.length}` : ""})`));
  if (!d.runs.length) m.append(el("div", "empty", "no `decomp behave` run recorded for it"));
  for (const r of d.runs) m.append(runCard(r));
}
load().catch(e => { $("m").replaceChildren(el("div", "bad", "failed: " + e)); });
</script>
</body>
</html>
