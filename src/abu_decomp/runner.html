<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runner</title>
<link rel="icon" href="data:,">
<meta name="description" content="Runner: watch every TAS run, a per-function coverage grid and decomp C in one view.">
<style>
:root {
  --bg: #0d0e12; --surface: #15171d; --raised: #1e2129; --line: #2a2e38; --text: #eceef3; --dim: #969cab; --faint: #5d6372;
  --accent: #9d8cff; --accent-ink: #0d0e12; --good: #3fc35a; --bad: #ff5c5c; --warn: #d9a400;
  --hot: #ffe27a;
  --hit: rgba(63, 195, 90, .16); --miss: rgba(255, 92, 92, .13); --part: rgba(217, 164, 0, .16);
  --s-unassigned: #222222; --s-data: #6b7280; --s-unmapped: #555555; --s-fuzzy: #d9a400; --s-exact: #3b7ddd; --s-named: #1aa7a1; --s-covered: #3fc35a;
  --src0: #3a4052; --src1: #5b86d6; --src2: #a9c8ff; --rt0: #3a4052; --rt1: #2f9e4f; --rt2: #86f0a3; --orc: #e0a040; --b-ok: #3fc35a; --b-diff: #ff6b5c;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px; --gutter: 16px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f7f7fa; --surface: #ffffff; --raised: #eef0f4; --line: #dde0e7; --text: #13151b; --dim: #5b6070; --faint: #a3a8b5;
  --accent: #5b43d6; --accent-ink: #ffffff; --s-unassigned: #e8e8e8; --src0: #cdd2dd; --src1: #7ea2e6; --src2: #1f4fb8; --rt0: #cdd2dd; --rt1: #5fbf7c; --rt2: #12793a; --orc: #c27c10; --b-ok: #12793a; --b-diff: #d93a2b; --hot: #ff8a00; color-scheme: light; } }
:root[data-theme="light"] { --bg: #f7f7fa; --surface: #ffffff; --raised: #eef0f4; --line: #dde0e7; --text: #13151b; --dim: #5b6070;
  --faint: #a3a8b5; --accent: #5b43d6; --accent-ink: #ffffff; --s-unassigned: #e8e8e8; --src0: #cdd2dd; --src1: #7ea2e6; --src2: #1f4fb8; --rt0: #cdd2dd; --rt1: #5fbf7c; --rt2: #12793a; --orc: #c27c10; --b-ok: #12793a; --b-diff: #d93a2b; --hot: #ff8a00; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--sans); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
svg.i { width: 20px; height: 20px; flex: none; }
.ib { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 7px; color: var(--dim); }
.ib:hover { background: var(--raised); color: var(--text); }
.ib svg.i { width: 18px; height: 18px; }
.ib[disabled] { opacity: .35; pointer-events: none; }
.ib.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); }

/* header */
header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 var(--gutter);
  background: var(--bg); }
.logo { display: flex; align-items: center; gap: 8px; font: 700 16px var(--mono); letter-spacing: -.01em; text-decoration: none; color: var(--text); }
.logo .mark { width: 20px; height: 20px; display: block; }
.search { position: relative; flex: 1; max-width: 600px; margin: 0 auto; }
.search input { width: 100%; height: 38px; padding: 0 16px 0 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--text); font: 15px var(--sans); outline: none; }
.search input:focus { border-color: var(--accent); }
.search > svg { position: absolute; left: 12px; top: 10px; width: 18px; height: 18px; color: var(--dim); }
.search kbd { position: absolute; right: 10px; top: 9px; font: 12px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.results { position: absolute; left: 0; right: 0; top: 46px; max-height: min(70vh, 520px); overflow: auto; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; display: none; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.results.open { display: block; }
.res { display: flex; align-items: center; gap: 10px; padding: 7px 14px; cursor: pointer; }
.res.sel, .res:hover { background: var(--raised); }
.res .nm { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res .nm mark { background: none; color: var(--accent); font-weight: 700; }
.res .rt { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 6px; background: var(--raised); white-space: nowrap; font-size: 13px; }
.ctl { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.ctl:hover { border-color: var(--accent); }
.ctl.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ctl .lbl { font-size: 13px; }
.hdr-right { display: flex; align-items: center; gap: 4px; }
#searchOpen { display: none; }

/* grid */
main { padding: 0 var(--gutter) 40px; min-width: 0; }
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 0 24px; padding-right: var(--gutter); align-items: start; }
.shell > .side { position: sticky; top: 64px; max-height: calc(100vh - 72px); overflow-y: auto; padding-top: 4px; }
.row-h { display: flex; align-items: center; gap: 8px; margin: 22px 0 12px; font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--dim); }
.row-h svg.i { width: 16px; height: 16px; }
.row-h .count { color: var(--faint); }
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
.filters .chip { cursor: pointer; }
.filters .chip { height: 28px; } .filters .chip.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px 16px; }
.tile { cursor: pointer; min-width: 0; }
.thumb { position: relative; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: #000; outline: 1px solid var(--line); outline-offset: -1px; }
.tile:hover .thumb { outline-color: var(--accent); }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); }
.thumb .ph svg { width: 36px; height: 36px; }
.badge { position: absolute; display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 6px; border-radius: 3px;
  background: rgba(10,11,15,.82); color: #e8eaf0; font: 600 11px var(--mono); letter-spacing: .02em; }
.badge svg { width: 13px; height: 13px; }
.badge.br { right: 6px; bottom: 8px; } .badge.tl { left: 6px; top: 6px; } .badge.bl { left: 6px; bottom: 8px; }
.rdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.badge.live { color: #b9adff; text-transform: uppercase; }
.pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.18); }
.prog i { display: block; height: 100%; background: var(--accent); }
.meta { display: flex; gap: 10px; padding-top: 10px; }
.meta .t { font: 600 13px var(--mono); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.meta .s { color: var(--dim); font-size: 13px; margin-top: 2px; }
.more { display: block; margin: 20px auto 0; }

/* watch */
.watch { padding-top: 4px; }
.main-col { min-width: 0; }
.player { position: relative; aspect-ratio: 4 / 3; max-height: calc(100vh - 220px); margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; width: 100%; }
.player img, .player canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
.player.split { aspect-ratio: 8 / 3; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.player .osd { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
.player .osd .badge { position: static; }
.player .lsl { left: 8px; bottom: 8px; } .player .lsl.o { left: calc(50% + 9px); }
.scrub { position: relative; height: 18px; margin-top: 8px; cursor: pointer; }
.scrub .bar { position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--line); }
.scrub .bar::after { content: ""; position: absolute; inset: -3px 0; background: repeating-linear-gradient(90deg, var(--faint) 0 1px, transparent 1px 10%); opacity: .7; }
.scrub .fill { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 1px; background: var(--accent); }
.scrub .mk { position: absolute; top: 3px; width: 3px; height: 12px; border-radius: 1px; background: var(--warn); }
.wtitle { display: flex; align-items: center; gap: 12px; margin: 10px 0 4px; flex-wrap: wrap; }
.wtitle h1 { font: 700 18px var(--mono); margin: 0; word-break: break-word; }
.bar-actions { display: flex; align-items: center; gap: 2px; margin-left: auto; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.bar-actions .sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
.wsub { color: var(--dim); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
.side { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tabs button { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--dim); white-space: nowrap; overflow: hidden; }
.tabs button svg.i { width: 16px; height: 16px; }
.tabs button.on { background: var(--raised); color: var(--text); } .tabs button.on svg { color: var(--accent); }
.tabs button[disabled] { opacity: .4; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.upnext { margin-top: 18px; }
.upnext .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px 12px; }

/* map */
.ladder { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; margin-top: 8px; }
.ladder .chip { height: 24px; padding: 0 8px; font: 12px var(--mono); } .ladder .chip svg { width: 13px; height: 13px; }
.ladder .gap { color: var(--bad); }
.mzlive { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.mapwrap { position: relative; margin-top: 8px; }
canvas#map { display: block; touch-action: manipulation; }
.hc { position: absolute; z-index: 5; pointer-events: none; width: 250px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 11px; box-shadow: 0 10px 28px rgba(0,0,0,.45); font-size: 12px; }
.hc[hidden], .peek[hidden] { display: none; }
.hn { font: 700 13px var(--mono); word-break: break-all; margin-bottom: 4px; }
.hr { display: flex; align-items: center; gap: 6px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hr svg { width: 13px; height: 13px; color: var(--accent); flex: none; }
.hg { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 8px; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); }
.hg span { color: var(--dim); } .hg b { font: 600 12px var(--mono); }
.hf { display: flex; align-items: center; gap: 5px; margin-top: 8px; color: var(--accent); font-size: 11px; } .hf svg { width: 13px; height: 13px; }
.hbar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; margin-top: 6px; } .hbar i { display: block; height: 100%; background: var(--accent); }
.tag { font-size: 10px; padding: 0 5px; border-radius: 3px; background: var(--raised); color: var(--dim); }
.sq { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
.sq.hollow { box-shadow: inset 0 0 0 1.5px var(--faint); }
.peek { display: flex; gap: 10px; align-items: flex-end; margin-top: 10px; padding: 10px; border: 1px solid var(--accent); border-radius: 8px; font-size: 12px; }
.peek .pk { flex: 1; min-width: 0; }
.tip { position: fixed; z-index: 60; pointer-events: none; max-width: 240px; padding: 4px 8px; border-radius: 6px; background: var(--raised); color: var(--text);
  border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.4); font: 12px/1.35 system-ui, sans-serif; }
.tip[hidden] { display: none; }
.bars { display: grid; gap: 12px; }
.bar .bh { display: flex; align-items: baseline; gap: 8px; }
.bar .bn { font-weight: 700; font-size: 13px; } .bar .bd { font-size: 12px; color: var(--dim); }
.bar .big { font: 700 24px/1 var(--mono); font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 2px; height: 24px; margin-top: 6px; }
.sg { min-width: 14px; border-radius: 4px; border: 1px solid transparent; padding: 0; cursor: pointer; }
.sg:not(.on) { background: transparent !important; border-color: var(--line); background-image: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 6px) !important; }
.lgds { display: flex; flex-wrap: wrap; gap: 2px 4px; margin-top: 4px; }
.lg { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 7px; border-radius: 6px; border: 1px solid transparent; color: var(--dim); font-size: 12px; cursor: pointer; }
.lg i { width: 10px; height: 10px; border-radius: 2px; flex: none; } .lg b { font: 600 11px var(--mono); color: var(--faint); }
.lg:hover { background: var(--raised); color: var(--text); } .lg.on { border-color: var(--accent); color: var(--text); } .lg:not(.on) i { opacity: .3; }
.c-dec-asm { background: var(--src0); } .c-dec-fuzzy { background: var(--src1); } .c-dec-exact { background: var(--src2); }
.c-exe-never { background: var(--rt0); } .c-exe-port { background: var(--rt1); } .c-exe-both { background: var(--rt2); } .c-exe-oracle { background: var(--orc); }
.c-beh-behaves { background: var(--b-ok); } .c-beh-differs { background: var(--b-diff); } .c-beh-pending { background: var(--rt0); }
.mapctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.mapctl .shown { font-size: 13px; color: var(--dim); margin-right: auto; } .mapctl .shown b { font: 700 15px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.mapctl .chip { height: 28px; font-size: 12px; } .mapctl .chip.on { outline: 1px solid var(--accent); }
.foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--dim); }
.foot b { font: 700 13px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; } .foot .chip { height: 24px; padding: 0 8px; font: 12px var(--mono); }
.toggle { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
.toggle svg { width: 14px; height: 14px; }
.feedtxt { font: 600 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.toggle.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* function */
.fnh { display: flex; align-items: center; gap: 4px; }
.fnh h2 { margin: 0 4px; font: 700 16px var(--mono); word-break: break-all; }
.facts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.facts .chip { height: 26px; font-size: 12px; padding: 0 9px; }
.calls { display: grid; grid-template-columns: 52px 1fr 64px; gap: 6px 8px; align-items: center; font-size: 12px; margin-top: 10px; }
.calls .b { height: 10px; border-radius: 5px; background: var(--raised); overflow: hidden; }
.calls .b i { display: block; height: 100%; }
.calls .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
.xref { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.xref h4 { margin: 0 0 6px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); font-weight: 600; }
.xref h4 svg { width: 16px; height: 16px; }
.hop { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 6px; border-radius: 6px; font: 12px var(--mono); text-align: left; }
.hop:hover { background: var(--raised); }
.hop span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code { margin-top: 10px; border-radius: 8px; background: var(--bg); overflow: auto; max-height: 56vh; font: 12.5px/1.55 var(--mono); }
.code table { border-collapse: collapse; width: 100%; }
.code td { padding: 0 10px 0 0; white-space: pre; vertical-align: top; }
.code td.ln { color: var(--faint); text-align: right; padding: 0 8px; user-select: none; position: sticky; left: 0; background: var(--bg); }
.code td.ct { color: var(--dim); text-align: right; padding: 0 8px; font-size: 11px; user-select: none; min-width: 52px; }
.code tr.h td.ct { background: var(--hit); color: var(--good); } .code tr.m td.ct { background: var(--miss); color: var(--bad); }
.code tr.p td.ct { background: var(--part); color: var(--warn); }
.code tr.m td.src { background: var(--miss); }
.code .k, .code .kt, .code .kr { color: #c792ea; } .code .nf { color: #82aaff; } .code .mi, .code .mh, .code .mf, .code .mo, .code .il { color: #f78c6c; }
.code .s, .code .s1, .code .s2, .code .sc { color: #c3e88d; } .code .c1, .code .cm, .code .c { color: var(--faint); font-style: italic; }
.code .cp, .code .cpf { color: #89ddff; } .code .o { color: #89ddff; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .code .k, :root:not([data-theme="dark"]) .code .kt { color: #7c3aed; }
  :root:not([data-theme="dark"]) .code .nf { color: #1d4ed8; } :root:not([data-theme="dark"]) .code .mi, :root:not([data-theme="dark"]) .code .mh { color: #c2410c; }
  :root:not([data-theme="dark"]) .code .cp, :root:not([data-theme="dark"]) .code .o { color: #0e7490; } }
.movies { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.movies .chip { height: 28px; font-size: 12px; cursor: pointer; }
.movies .chip svg { width: 14px; height: 14px; }
.sec { margin-top: 14px; font-size: 12px; font-weight: 700; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.sec svg { width: 16px; height: 16px; }
.empty { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12px; padding: 8px 0; }
.empty svg { width: 16px; height: 16px; }
.claims { font: 11.5px var(--mono); color: var(--dim); margin: 6px 0 0; padding-left: 16px; }
.claims li { margin: 2px 0; }
.dv { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; } .dv th { text-align: left; color: var(--dim); font-weight: 600; padding: 2px 8px; } .dv td { padding: 2px 8px; border-top: 1px solid var(--line, #2a2a2a); } .dv tr.x td { background: color-mix(in srgb, var(--b-diff) 18%, transparent); }
.cases { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; }
.case { display: flex; align-items: center; gap: 6px; padding: 2px 0; } .case .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case .side { margin-left: auto; display: inline-flex; } .case .side + .side { margin-left: 0; } .case .side svg { width: 14px; height: 14px; }
.case .side.ok { color: var(--good); } .case .side.bad { color: var(--bad); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px;
  border-radius: 8px; display: none; align-items: center; gap: 8px; font-size: 13px; z-index: 50; }
.toast.on { display: flex; }
.pad { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 88%, transparent); justify-content: space-between; align-items: center; gap: 10px; user-select: none; -webkit-user-select: none; touch-action: none; }
.pad.on { display: flex; }
.stick { width: 132px; height: 132px; border-radius: 50%; background: var(--raised); border: 1px solid var(--line); position: relative; flex: none; }
.stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: var(--faint); }
.pbtns { display: grid; grid-template-columns: repeat(4, 48px); gap: 8px; }
.pbtns button { height: 48px; padding: 0; border-radius: 50%; font-weight: 600; background: var(--raised); border: 1px solid var(--line); }

<script src="/static/uFuzzy.iife.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const icon = (n, cls = "i") => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATE_VAR = { asm: "--s-unmapped", unmapped: "--s-unmapped", fuzzy: "--s-fuzzy", exact: "--s-exact", named: "--s-named", covered: "--s-covered" };
const D = { skew: 0, live: { now: 0, runs: [], build: {} }, fns: null, movies: { rows: [] }, summary: null, man: {}, fnCache: new Map(), fnIndex: new Map(), pending: new Map() };
const UI = { watching: null, fn: null, back: [], fwd: [], filter: "all", shown: 48, control: false, controlRun: null, sound: false, split: false, sel: null, pick: null };
const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
  .then(r => r.json()).catch(() => ({ error: "server unreachable" }));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* pure:begin (unit-tested under node: tests/test_tas_page.py cuts this block out of the page) */
// Frame stream framing (the /video and /wall wire format): u32 BE length (top bit set = a reach record), u64 BE capture stamp, u32 BE seq.
function makeFramer(onRec) {
  let buf = new Uint8Array(0);
  return chunk => {
    if (buf.length) { const j = new Uint8Array(buf.length + chunk.length); j.set(buf); j.set(chunk, buf.length); buf = j; } else buf = chunk;
    let o = 0;
    while (buf.length - o >= 16) {
      const dv = new DataView(buf.buffer, buf.byteOffset + o, 16), raw = dv.getUint32(0), n = raw & 0x7fffffff;
      if (n > 16 * 1024 * 1024) throw Error("invalid frame length");
      if (buf.length - o < 16 + n) break;
      onRec({ reach: !!(raw & 0x80000000), stamp: Number(dv.getBigUint64(4)), seq: dv.getUint32(12), body: buf.subarray(o + 16, o + 16 + n) });
      o += 16 + n;
    }
    buf = buf.slice(o);
  };
}
// Reach record (GAME-RUNNER 10a): u8 type (1 full bitset, 2 delta), u32 LE poll; full: bitset over fns rows; delta: varint n + delta-coded fresh rows, then the same for hot.
function applyReach(F, u, t) {
  const poll = (u[1] | u[2] << 8 | u[3] << 16 | u[4] << 24) >>> 0;
  if (u[0] === 1) { F.bits = u.slice(5); F.n = 0; for (const x of F.bits) for (let v = x; v; v &= v - 1) F.n++; }
  else if (u[0] === 2 && F.bits) {
    let i = 5;
    const rd = () => { let v = 0, s = 0, c; do { c = u[i++]; v |= (c & 127) << s; s += 7; } while (c & 128 && i <= u.length); return v >>> 0; };
    for (let pass = 0; pass < 2; pass++) {
      let n = rd(), p = 0;
      while (n-- > 0 && i <= u.length) {
        p += rd();
        if (p >> 3 >= F.bits.length) continue;
        if (pass === 0) { if (!(F.bits[p >> 3] & (1 << (p & 7)))) { F.bits[p >> 3] |= 1 << (p & 7); F.n++; } F.fresh.set(p, t); }
        F.hot.set(p, t);
      }
    }
  } else return false;
  F.poll = poll; F.bytes += u.length; F.recs++; F.maxRec = Math.max(F.maxRec, u.length);
  return true;
}
// A baked file's served path: manifest.json maps the logical name ("fns", "fnrows") to its content-hashed file; an unknown manifest falls back to the plain name.
function dataPath(man, key, fallback) {
  const m = man && typeof man === "object" ? man : {};
  const pools = [m, m.files, m.data].filter(x => x && typeof x === "object" && !Array.isArray(x));
  const strip = n => "/data/" + String(n).replace(/^\/?(data\/)?/, "");
  for (const o of pools) if (typeof o[key] === "string") return strip(o[key]);
  const re = new RegExp("^" + key + "\\.[0-9a-f]{6,}\\.(json|txt)$");
  const names = pools.flatMap(o => Object.keys(o).concat(Object.values(o).filter(v => typeof v === "string"))).concat(Array.isArray(m.files) ? m.files : []);
  const hit = names.find(n => typeof n === "string" && re.test(n.split("/").pop()));
  return hit ? strip(hit) : strip(fallback);
}
// Pad state from keys, the Gamepad API and the touch pad (N64 button bits).
const BT = { A: 0x8000, B: 0x4000, Z: 0x2000, START: 0x1000, UP: 0x0800, DOWN: 0x0400, LEFT: 0x0200, RIGHT: 0x0100,
             L: 0x0020, R: 0x0010, CUP: 0x0008, CDOWN: 0x0004, CLEFT: 0x0002, CRIGHT: 0x0001 };
const KEYS = [
  ["ArrowUp", "stick up"], ["ArrowDown", "stick down"], ["ArrowLeft", "stick left"], ["ArrowRight", "stick right"],
  ["KeyX", "A"], ["KeyC", "B"], ["KeyZ", "Z"], ["Enter", "START"], ["KeyA", "L"], ["KeyS", "R"],
  ["KeyI", "CUP"], ["KeyK", "CDOWN"], ["KeyJ", "CLEFT"], ["KeyL", "CRIGHT"],
  ["KeyT", "UP"], ["KeyG", "DOWN"], ["KeyF", "LEFT"], ["KeyH", "RIGHT"],
];
const PAD_BUTTONS = [[0, "A"], [1, "B"], [2, "B"], [3, "CUP"], [4, "L"], [5, "R"], [6, "Z"], [7, "Z"], [9, "START"], [12, "UP"], [13, "DOWN"], [14, "LEFT"], [15, "RIGHT"]];
const STICK = 80, DEADZONE = 0.15;
function padState(keys, touch, gamepads) {
  let buttons = touch.buttons, x = touch.x, y = touch.y;
  for (const [code, what] of KEYS) {
    if (!keys.has(code)) continue;
    if (what === "stick up") y += STICK; else if (what === "stick down") y -= STICK;
    else if (what === "stick left") x -= STICK; else if (what === "stick right") x += STICK;
    else buttons |= BT[what];
  }
  for (const g of gamepads) {
    if (!g) continue;
    for (const [i, what] of PAD_BUTTONS) if (g.buttons[i] && g.buttons[i].pressed) buttons |= BT[what];
    const ax = v => Math.abs(v) < DEADZONE ? 0 : Math.round((v - Math.sign(v) * DEADZONE) / (1 - DEADZONE) * STICK);
    if (g.axes.length >= 2) { x += ax(g.axes[0]); y -= ax(g.axes[1]); }
    if (g.axes.length >= 4) {
      if (g.axes[2] > 0.5) buttons |= BT.CRIGHT; if (g.axes[2] < -0.5) buttons |= BT.CLEFT;
      if (g.axes[3] > 0.5) buttons |= BT.CDOWN; if (g.axes[3] < -0.5) buttons |= BT.CUP;
    }
  }
  const c = v => Math.max(-STICK, Math.min(STICK, Math.round(v)));
  return { buttons, x: c(x), y: c(y) };
}
// Port pixels that differ from the original's by more than `thr` (sum of RGB deltas) turn magenta; the rest dim. Returns the share.
function diffPixels(d, o, thr) {
  let n = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (Math.abs(d[i] - o[i]) + Math.abs(d[i + 1] - o[i + 1]) + Math.abs(d[i + 2] - o[i + 2]) > thr) { d[i] = 255; d[i + 1] = 0; d[i + 2] = 200; n++; }
    else { d[i] >>= 2; d[i + 1] >>= 2; d[i + 2] >>= 2; }
  }
  return n / Math.max(1, d.length / 4);
}
// ---------- the three bars: segments per bar and the include/exclude filter (pure) ----------
// A function sits in exactly one segment of every bar. Within a bar the selected segments OR; across bars they AND.
const BARS = [
  { key: "dec", name: "Decomp", segs: [["asm", "asm"], ["fuzzy", "decompiled (fuzzy)"], ["exact", "exact"]] },
  { key: "exe", name: "Exercised", segs: [["never", "never run"], ["port", "port only"], ["both", "both"], ["oracle", "original only"]] },
  { key: "beh", name: "Behaviour", segs: [["behaves", "behaves"], ["differs", "differs"], ["pending", "not compared yet"]] },
];
const DEC_SEG = { asm: "asm", unmapped: "asm", fuzzy: "fuzzy", exact: "exact", named: "exact", covered: "exact" };  // named = exact C with a clean name
const EXE_SEG = { none: "never", port: "port", both: "both", oracle: "oracle" };
function rowSegs(row) {  // fns.json row -> [decomp seg, exercised seg, behaviour seg]; row[7] is the per-call verdict (behaves, differs-args, differs-result, missing, port-only, "" = not compared)
  return [DEC_SEG[row[3]] || "asm", EXE_SEG[row[5]] || "never", row[7] === "behaves" ? "behaves" : row[7] ? "differs" : "pending"];
}
const defaultSel = () => ({ dec: new Set(["asm", "fuzzy", "exact"]), exe: new Set(["port", "both"]), beh: new Set(["differs"]) });
const allSel = () => Object.fromEntries(BARS.map(b => [b.key, new Set(b.segs.map(s => s[0]))]));
const passesSel = (sel, segs) => BARS.every((b, i) => sel[b.key].has(segs[i]));
const sameSel = (a, b) => BARS.every(x => a[x.key].size === b[x.key].size && [...a[x.key]].every(k => b[x.key].has(k)));
function toggleSeg(sel, bar, k) { const s = sel[bar]; s.has(k) ? s.delete(k) : s.add(k); }
function barStats(rows) {  // per bar and segment [functions, bytes]; scope = exercised or compared code (the Behaviour big number's base)
  const stat = Object.fromEntries(BARS.map(b => [b.key, Object.fromEntries(b.segs.map(s => [s[0], [0, 0]]))]));
  const segs = rows.map(r => rowSegs(r)), scope = [0, 0], total = [0, 0];
  rows.forEach((r, i) => {
    BARS.forEach((b, a) => { const c = stat[b.key][segs[i][a]]; c[0]++; c[1] += r[2]; });
    total[0]++; total[1] += r[2];
    if (segs[i][1] !== "never" || segs[i][2] !== "pending") { scope[0]++; scope[1] += r[2]; }
  });
  return { segs, stat, scope, total };
}
function bigNumbers(st) {  // the three headline percents (of code bytes): exact decomp, exercised, behaves of exercised code
  const pct = (a, b) => b ? 100 * a / b : 0;
  return {
    dec: pct(st.stat.dec.exact[1], st.total[1]),
    exe: pct(st.total[1] - st.stat.exe.never[1], st.total[1]),
    beh: pct(st.stat.beh.behaves[1], st.scope[1]),
  };
}
/* pure:end */
UI.sel = defaultSel();

const now = () => Date.now() / 1000 + D.skew;
function ago(t) { const s = Math.max(0, now() - t); return s < 60 ? `${s | 0}s` : s < 3600 ? `${s / 60 | 0}m` : s < 86400 ? `${s / 3600 | 0}h` : `${s / 86400 | 0}d`; }
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function toast(ic, text) { const t = $("toast"); t.innerHTML = icon(ic) + esc(text); t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2600); }
const OUT_ICON = { ok: "circle-check", crash: "skull", hang: "hourglass", stop: "square", exit: "circle-alert", refused: "circle-alert" };
const poster = m => `/data/posters/${encodeURIComponent(m)}.jpg`;

async function getJson(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw Error(`${path}: ${r.status}`);
  return r.json();
}
async function boot() {
  // First paint needs only the sprite, live.json and the manifest (5 requests with the page and uFuzzy); the big baked files follow.
  const [sprite, live, man] = await Promise.all([
    fetch("/static/icons.svg").then(r => r.text()), getJson("/data/live.json", { cache: "no-cache" }).catch(() => null), getJson("/data/manifest.json", { cache: "no-cache" }).catch(() => ({}))]);
  document.body.insertAdjacentHTML("afterbegin", sprite);
  D.man = man;
  if (live) { D.live = live; D.skew = live.now - Date.now() / 1000; }
  $("build").innerHTML = D.live.build && D.live.build.pin ? `${icon("git-branch")}${D.live.build.pin.slice(0, 8)}` : "";
  $("ctl").onclick = toggleControl;
  wireGlobal();
  window.addEventListener("hashchange", route);
  route();
  setInterval(liveTick, 2000);
  loadBaked();
}
async function loadBaked() {
  try {
    const [fns, movies, summary] = await Promise.all([getJson(dataPath(D.man, "fns", "fns.json")), getJson("/data/movies.json"), getJson("/data/summary.json")] );
    Object.assign(D, { fns, movies, summary });
    D.fnIndex = new Map(fns.rows.map((r, i) => [r[0], i]));
    gridData();
    initSearch();
    dataReady();
  } catch (e) { toast("circle-alert", "baked data unavailable: " + e.message); }
}
function dataReady() {
  if (!UI.watching && !/^#\/f\//.test(location.hash) && location.hash !== "#/film") renderGrid();
  else if (/^#\/f\//.test(location.hash) && !$("side")) route();
  else if ($("side")) renderSide();
  else if (location.hash === "#/film") route();
}
async function liveTick() {
  if (document.hidden) return;
  try {
    const text = await fetch("/data/live.json", { cache: "no-cache" }).then(r => r.ok ? r.text() : Promise.reject());
    if (text !== liveTick.last) { liveTick.last = text; applyLive(JSON.parse(text)); }
  } catch (e) {}
}
const sigOf = l => l.runs.map(r => r.id + r.status + (r.input || "") + (r.pinned ? "p" : "") + (r.outcome || "")).join();
function applyLive(next) {
  const prev = D.live, was = UI.watching ? runById(UI.watching) : null;
  D.live = next; D.skew = next.now - Date.now() / 1000;
  for (const id of D.pending.keys()) if (runById(id)) D.pending.delete(id);
  $("build").innerHTML = next.build && next.build.pin ? `${icon("git-branch")}${next.build.pin.slice(0, 8)}` : "";
  const r = UI.watching ? runById(UI.watching) : null;
  if (UI.control && UI.controlRun) {
    const c = runById(UI.controlRun);
    if (c && c.status !== "running") setControl(false, null);
    else if (c && c.input === "human") UI.controlSeen = true;
    else if (c && UI.controlSeen) setControl(false, null);
  }
  unionPrune();
  if (location.hash === "#/film") return;
  const changed = sigOf(prev) !== sigOf(next);
  if (!UI.watching) { if (changed) renderGrid(); else patchTiles(); return; }
  if (r && was && (was.status !== r.status || was.pinned !== r.pinned || (was.oracle ? 1 : 0) !== (r.oracle ? 1 : 0))) { renderWatch(); return; }
  if (r) patchWatch(r);
  if (changed) refreshOthers();
}
function patchTiles() {
  for (const r of D.live.runs) {
    const t = document.querySelector(`.tile[data-run="${CSS.escape(r.id)}"] .prog i`);
    if (t) t.style.width = (r.polls ? Math.min(100, 100 * r.poll / r.polls) : 0) + "%";
  }
}
function patchWatch(r) {
  const pc = $("pollc"); if (pc) pc.textContent = `${r.poll}/${r.polls}`;
  const f = document.querySelector("#scrub .fill"); if (f) f.style.width = (r.polls ? Math.min(100, 100 * r.poll / r.polls) : 100) + "%";
}

// ---------- routing ----------
function route() {
  const [, kind, arg] = location.hash.match(/^#\/(\w+)?\/?(.*)$/) || [];
  const name = decodeURIComponent(arg || "");
  document.body.classList.toggle("film", kind === "film");
  if (kind === "w") { UI.watching = name; renderWatch(); }
  else if (kind === "f") { openFn(name, false); }
  else if (kind === "film") renderFilm();
  else renderGrid();
  window.scrollTo(0, 0);
}
// live.json `runs` holds the running, queued and newest finished runs (serve class Live); finished = recent.
function recentRuns() { return D.live.runs.filter(r => r.status !== "running" && r.status !== "queued"); }
function runById(id) { return D.live.runs.find(r => r.id === id) || D.pending.get(id); }
function runForMovie(m) { return D.live.runs.find(r => r.movie === m); }

// ---------- grid ----------
const pic = (movie, wall) => `<div class="ph">${icon("clapperboard")}</div><img loading="lazy" ${wall ? `data-wall="${esc(wall)}" ` : ""}src="${poster(movie)}" alt="" onerror="this.remove()">`;
function tile(r) {
  const live = r.status === "running";
  const pct = r.polls ? Math.min(100, 100 * r.poll / r.polls) : 0;
  const sp = r.input === "human" ? `${icon("gamepad-2")}1×` : `${icon("fast-forward")}`;
  const right = live ? `<span class="badge br">${sp}</span>` : `<span class="badge br">${icon(OUT_ICON[r.outcome] || "circle-alert")}${r.poll}</span>`;
  return `<div class="tile" data-run="${esc(r.id)}"><div class="thumb">${pic(r.movie, live ? r.id : "")}${live ? `<span class="badge tl live"><i class="pulse"></i>live</span><span class="badge bl mono" data-lit="${esc(r.id)}"><i class="rdot" style="background:${runHue(r.id)}"></i>${UN.runs.get(r.id)?.n || 0}</span>` : ""}${right}
    ${live ? `<div class="prog"><i style="width:${pct}%"></i></div>` : ""}</div>
    <div class="meta"><div><div class="t">${esc(r.movie)}</div><div class="s">${esc(r.label || "")}${r.subject ? " · " + esc(r.subject) : ""} · ${live ? `${pct | 0}%` : ago(r.ended || r.started)}</div></div></div></div>`;
}
function movieTile(m) {
  const [name, polls, outcome, fn, last] = m;
  return `<div class="tile" data-movie="${esc(name)}"><div class="thumb">${pic(name)}
    <span class="badge br">${icon(OUT_ICON[outcome] || "circle-alert")}${polls}</span></div>
    <div class="meta"><div><div class="t">${esc(name)}</div><div class="s">${fn ? esc(fn) + " · " : ""}${last ? ago(last) : "never"}</div></div></div></div>`;
}
function renderGrid() {
  UI.watching = null; stopStage();

  const mv = D.movies.rows.filter(m => UI.filter === "all" || m[2] === UI.filter);
  const f = (k, ic, label) => `<button class="chip ${UI.filter === k ? "on" : ""}" data-filter="${k}" title="${label}">${icon(ic)}</button>`;
  $("view").innerHTML = `
    <div class="row-h"><i class="pulse"></i>Live <span class="count">${live.length}</span></div>
    <div class="grid">${live.map(r => tile(r)).join("") || `<div class="empty">${icon("fast-forward")}nothing running</div>`}</div>
    <div class="row-h">${icon("history")}Recent</div>
    <div class="grid">${recentRuns().slice(0, 12).map(r => tile(r)).join("")}</div>
    <div class="row-h">${icon("clapperboard")}Movies <span class="count">${mv.length}</span>
      <div class="filters">${f("all", "layout-grid", "All")}${f("crash", "skull", "Crash")}${f("hang", "hourglass", "Hang")}${f("ok", "circle-check", "OK")}</div></div>
    <div class="grid">${mv.slice(0, UI.shown).map(movieTile).join("")}</div>
    ${mv.length > UI.shown ? `<button class="chip more" id="more" title="Show more">${icon("chevron-right")}${mv.length - UI.shown}</button>` : ""}`;
  $("view").onclick = e => {
    const t = e.target.closest("[data-run],[data-movie],[data-filter],#more");
    if (!t) return;

function scheduleDraw() {
  if (FEED.timer) return;
  FEED.timer = requestAnimationFrame(() => {
    FEED.timer = 0;
    const un = unionLive();
    if (!$("map") || !(feedLive() || un)) return;
    const t = performance.now(); drawMaze(); FEED.drawMs = performance.now() - t; feedText();
    if ((un ? [...UN.runs.values()] : [FEED]).some(F => F.hot.size || F.fresh.size)) setTimeout(scheduleDraw, 60);  // let the flashes and rings fade between records
  });
}
function feedLive() { return FEED.on && !!FEED.bits && FEED.run === UI.watching; }
function feedText() {
  const t = $("feedtxt"); if (!t) return;
  const un = !UI.watching && unionBits(), tr = UN.tile && runById(UN.tile);
  const lit = x => `${x} lit`, bits = a => a.reduce((n, x) => { for (let v = x; v; v &= v - 1) n++; return n; }, 0);
  t.textContent = feedLive() ? lit(FEED.n) : un ? (tr ? `${lit(UN.runs.get(UN.tile).n)} · ${tr.movie}` : `${lit(bits(un))} · ${unionFeeds().length} live`) : "…";
  t.title = `${FEED.recs} records, ${FEED.bytes} B so far (largest ${FEED.maxRec} B); last redraw ${FEED.drawMs.toFixed(1)} ms`;
}
function stopFeed() { if (FEED.timer) cancelAnimationFrame(FEED.timer); FEED.timer = 0; FEED.run = null; FEED.bits = null; FEED.n = 0; FEED.hot.clear(); FEED.fresh.clear(); FEED.bytes = FEED.recs = FEED.maxRec = 0; }
// Union lighting (owner 10-26): off Watch, the grid shows what every running run reaches now. Their records ride the /wall
// stream (seq = the run's index among running runs); each run keeps its own feed, the grid draws their OR, a run's flashes
// take its colour, hovering a tile shows only that run, hovering a square names the runs that reach it.
const UN = { runs: new Map(), tile: null };
function onWallReach(id, u) {
  let F = UN.runs.get(id);
  if (!F) UN.runs.set(id, F = { bits: null, n: 0, poll: 0, hot: new Map(), fresh: new Map(), bytes: 0, recs: 0, maxRec: 0 });
  if (!applyReach(F, u, performance.now())) return;
  const b = document.querySelector(`[data-lit="${CSS.escape(id)}"]`); if (b) b.lastChild.textContent = F.n;
  if (!UI.watching) scheduleDraw();
}
function unionPrune() {
  const on = new Set(D.live.runs.filter(r => r.status === "running").map(r => r.id));
  for (const id of UN.runs.keys()) if (!on.has(id)) UN.runs.delete(id);
  if (UN.tile && !UN.runs.has(UN.tile)) UN.tile = null;
}
function unionLive() { return FEED.on && !UI.watching && [...UN.runs.values()].some(F => F.bits); }
function unionFeeds() { return [...UN.runs].filter(([id, F]) => F.bits && (!UN.tile || UN.tile === id)); }
function unionBits() {
  const fs = unionFeeds(); if (!fs.length) return null;
  const u = new Uint8Array(fs[0][1].bits.length); for (const [, F] of fs) for (let i = 0; i < u.length; i++) u[i] |= F.bits[i];
  return u;
}
function reachers(fi) { return [...UN.runs].filter(([, F]) => F.bits && F.bits[fi >> 3] & (1 << (fi & 7))).map(([id]) => id); }
function runHue(id) { const i = D.live.runs.findIndex(r => r.id === id); return `hsl(${(Math.max(i, 0) * 137.5) % 360} 80% 58%)`; }

// ---------- function view ----------
async function openFn(name, push) {
  if (D.fns && !D.fnIndex.has(name)) { toast("circle-alert", name); return; }
  if (UI.fn && UI.fn !== name && push !== "nav") { UI.back.push(UI.fn); UI.fwd = []; }
  UI.fn = name;
  if (!$("player")) { renderWatch(); return; }
  if (location.hash !== `#/f/${encodeURIComponent(name)}` && UI.watching) history.replaceState(null, "", `#/f/${encodeURIComponent(name)}`);
  renderSide();
}
async function fnData(name) {
  if (D.fnCache.has(name)) return D.fnCache.get(name);
  let v = null;
  try { v = await getJson(`/data/fn/${encodeURIComponent(name)}.json`); } catch (e) {}
  if (v) D.fnCache.set(name, v);
  return v;
}
async function renderFn() {
  const name = UI.fn;
  if (!D.fns) { $("panel").innerHTML = `<div class="card"><div class="empty">${icon("code-xml")}loading…</div></div>`; return; }
  const row = D.fns.rows[D.fnIndex.get(name)];
  const f = await fnData(name);
  if (UI.fn !== name) return;
  const st = row[3], file = D.fns.files[row[4]];
  const hop = n => `<button class="hop" data-fn="${esc(n)}" title="${esc(n)}">${D.fnIndex.has(n) ? `<i class="dot" style="background:var(${STATE_VAR[D.fns.rows[D.fnIndex.get(n)][3]] || "--faint"})"></i>` : `<i class="dot" style="background:var(--faint)"></i>`}<span>${esc(n)}</span></button>`;
  const head = `<div class="fnh"><button class="ib" data-nav="back" ${UI.back.length ? "" : "disabled"} title="Back">${icon("arrow-left")}</button>
    <button class="ib" data-nav="fwd" ${UI.fwd.length ? "" : "disabled"} title="Forward">${icon("chevron-right")}</button><h2>${esc(name)}</h2></div>
    <div class="facts"><span class="chip"><i class="dot" style="background:var(${STATE_VAR[st] || "--faint"})"></i>${esc(st)}</span><span class="chip">${row[2]} B</span>
      <span class="chip" title="reached by">${icon("locate-fixed")}${esc(row[5])}</span>${f && f.behaviour ? `<span class="chip">${icon(f.behaviour === "behaves" ? "circle-check" : "circle-alert")}${esc(f.behaviour)}</span>` : ""}
      <span class="chip mono" title="${esc(file)}">${icon("file-code-2")}${esc(file.split("/").pop())}${f ? ":" + f.first : ""}</span></div>`;
  if (!f) {
    $("panel").innerHTML = `<div class="card">${head}<div class="empty">${icon("circle-alert")}no baked file for this function yet</div></div>`;
    wireFn(); return;
  }
  const pc = f.port ? f.port.count : 0, oc = f.oracle ? f.oracle.count : 0, mx = Math.max(pc, oc, 1);
  const lines = f.lines || [], callers = f.callers || [], callees = f.callees || [], movies = f.movies || [], claims = f.claims || [], behave = f.behave || [];
  const rows = (f.html || []).map((h, i) => {
    const g = lines[i];
    let cls = "", ct = "";
    if (g) { const [c, bt, bn] = g; cls = c > 0 ? (bn && bt < bn ? "p" : "h") : "m"; ct = (c > 0 ? (c > 9999 ? (c / 1000 | 0) + "k" : c) : "0") + (bn ? ` ${bt}/${bn}` : ""); }
    return `<tr class="${cls}"><td class="ln">${f.first + i}</td><td class="ct">${ct}</td><td class="src">${h || " "}</td></tr>`;
  }).join("");
  const exe = lines.filter(Boolean), hit = exe.filter(g => g[0] > 0).length;
  $("panel").innerHTML = `<div class="card">${head}
    <div class="calls"><span class="dim">port</span><span class="b"><i style="width:${100 * pc / mx}%;background:var(--accent)"></i></span><span class="v">${pc}</span>
      <span class="dim">original</span><span class="b"><i style="width:${100 * oc / mx}%;background:var(--s-named)"></i></span><span class="v">${oc}</span></div>
    <div class="xref"><div><h4>${icon("arrow-up-left")}callers ${callers.length}</h4>${callers.map(hop).join("") || `<div class="empty">none static</div>`}</div>
      <div><h4>${icon("arrow-down-right")}callees ${callees.length}</h4>${callees.map(hop).join("") || `<div class="empty">none</div>`}</div></div>
    <div class="sec">${icon("code-xml")}C <span style="margin-left:auto;font-weight:400">${exe.length ? `${hit}/${exe.length} lines` : "no line counts yet"}</span></div>
    ${rows ? `<div class="code"><table>${rows}</table></div>` : `<div class="empty">${icon("circle-alert")}no source slice</div>`}
    <div class="sec">${icon("columns-2")}first diverging call, port vs original</div>
    ${divergence(f.call) || `<div class="empty">${icon("circle-alert")}no per-call capture of this function yet</div>`}
    <div class="sec">${icon("clapperboard")}reached by ${f.movies_total ?? movies.length}</div>
    <div class="movies">${movies.slice(0, 12).map(m => `<span class="chip" data-movie="${esc(m)}">${icon("play")}${esc(m)}</span>`).join("") || `<div class="empty">${icon("clapperboard")}no movie yet</div>`}</div>
    <div class="sec">${icon("columns-2")}inputs → outputs, port vs original</div>
    ${behave.length ? `<ul class="cases">${behave.map(caseRow).join("")}</ul>` : `<div class="empty">${icon("circle-alert")}no captured cases yet</div>`}
    ${claims.length ? `<ul class="claims">${claims.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
  </div>`;
  wireFn();
}
// The first diverging call (fns.json `call`, tas_coverage.call_behaviour): the differing arguments, then the call's raw words, return and the memory its pointer arguments name, port vs original.
const CAUSE_TXT = { input: "input already differs: fix upstream", own: "same input, other output: fix here" };
function divergence(c, line) {
  if (!c) return "";
  if (!c.first) return `<div class="empty">${icon("circle-check")}${c.compared} calls compared, none differ${c.unmatched_oracle || c.unmatched_port ? ` (${c.unmatched_oracle} only in the original, ${c.unmatched_port} only in the port)` : ""}</div>`;
  const f = c.first, o = f.oracle || {}, p = f.port || {}, bad = new Set((f.diffs || []).map(d => d.field));
  const hex = v => v == null ? "–" : Array.isArray(v) ? v.join(" ") : String(v);
  const row = (what, pv, ov, x) => `<tr class="${x ? "x" : ""}"><td>${esc(what)}</td><td class="mono">${esc(hex(pv))}</td><td class="mono">${esc(hex(ov))}</td></tr>`;
  const diffs = (f.diffs || []).map(d => row(`${d.field} (${d.kind})`, d.port, d.oracle, true)).join("");
  const raw = [0, 1, 2, 3].map(i => row(`word a${i}`, (p.args || [])[i], (o.args || [])[i], (p.args || [])[i] !== (o.args || [])[i])).join("");
  const who = c.cause ? ` · <span class="tag" title="${esc(CAUSE_TXT[c.cause] || "")}">${c.cause === "input" ? "fix upstream" : "own fault"}</span>` : "";
  const at = f.frame ? `poll ${f.frame.port} (port) / ${f.frame.oracle} (original)` : "";
  return `<div class="hr">${esc(c.verdict)} · ${c.compared} calls compared${who}</div>
    <div class="dim mono">${esc(f.what || "")} · caller ${esc(f.caller)} · call #${f.ordinal} · ${esc(at)}</div>
    <table class="dv"><tr><th>differs</th><th>port</th><th>original</th></tr>${diffs}</table>
    <table class="dv"><tr><th>whole call</th><th>port</th><th>original</th></tr>${raw}${row("return", p.ret, o.ret, bad.has("return"))}${row("memory (pointer windows)", p.writes, o.writes, (f.diffs || []).some(d => d.kind === "memory"))}</table>`;
}
// A behave case row is a string, or {text|call, port, oracle} with one tick or cross per side (decoded by the bake).
function caseRow(c) {
  if (typeof c === "string") return `<li class="case"><span class="mono">${esc(c)}</span></li>`;
  const mark = (side, v) => v == null ? "" : `<span class="side ${v ? "ok" : "bad"}" title="${side}">${icon(v ? "circle-check" : "circle-alert")}</span>`;
  const text = c.text || c.call || JSON.stringify(c);
  return `<li class="case"><span class="mono">${esc(text)}</span>${c.count > 1 ? `<span class="dim"> ×${c.count}</span>` : ""}${mark("port", c.port)}${mark("original", c.oracle)}</li>`;
}
function wireFn() {
  $("panel").onclick = e => {
    const t = e.target.closest("[data-fn],[data-nav],[data-movie]");
    if (!t) return;
    if (t.dataset.fn) openFn(t.dataset.fn, true);
    else if (t.dataset.movie) playMovie(t.dataset.movie);
    else if (t.dataset.nav === "back" && UI.back.length) { UI.fwd.push(UI.fn); openFn(UI.back.pop(), "nav"); }
    else if (t.dataset.nav === "fwd" && UI.fwd.length) { UI.back.push(UI.fn); openFn(UI.fwd.pop(), "nav"); }
  };
}

// ---------- search (prebuilt index, client-side, uFuzzy) ----------
function initSearch() {
  const names = D.fns.rows.map(r => r[0]), movies = D.movies.rows.map(m => m[0]);
  const hay = names.concat(movies);
  const uf = new uFuzzy({ intraMode: 1, intraIns: 1 });
  const q = $("q"), out = $("results");
  let sel = 0, list = [];
  const show = () => {
    const needle = q.value.trim();
    if (!needle) { out.classList.remove("open"); return; }
    const [idxs, info, order] = uf.search(hay, needle, 0, 1e3);
    list = [];
    if (idxs) {
      const ord = order || idxs.map((_, i) => i);
      for (const oi of ord.slice(0, 40)) {
        const i = info ? info.idx[oi] : idxs[oi];
        list.push({ i, ranges: info ? info.ranges[oi] : null });
      }
    }
    sel = 0;
    out.innerHTML = list.map((it, k) => {
      const isFn = it.i < names.length, label = hay[it.i];
      const marked = it.ranges ? uFuzzy.highlight(label, it.ranges, (p, m) => m ? `<mark>${esc(p)}</mark>` : esc(p)) : esc(label);
      const row = isFn ? D.fns.rows[it.i] : D.movies.rows[it.i - names.length];
      const lead = isFn ? `<i class="dot" style="background:var(${STATE_VAR[row[3]]})"></i>` : icon("clapperboard");
      const right = isFn ? `${row[2]} B · ${esc(D.fns.files[row[4]].split("/").slice(-2).join("/"))}` : `${row[1]} polls`;
      return `<div class="res ${k === sel ? "sel" : ""}" data-k="${k}" role="option">${lead}<span class="nm">${marked}</span><span class="rt">${right}</span></div>`;
    }).join("") || `<div class="empty" style="padding:8px 14px">${icon("search")}no match</div>`;
    out.classList.add("open");
  };
  const pick = k => {
    const it = list[k]; if (!it) return;
    out.classList.remove("open"); q.blur(); $("hdr").classList.remove("searching");
    if (it.i < names.length) { if (!UI.watching) { UI.fn = hay[it.i]; location.hash = `#/f/${encodeURIComponent(hay[it.i])}`; } else openFn(hay[it.i], true); }
    else playMovie(hay[it.i]);
  };
  q.addEventListener("input", show);
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, Math.min(list.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1)));
      out.querySelectorAll(".res").forEach((el, k) => el.classList.toggle("sel", k === sel)); out.querySelector(".res.sel")?.scrollIntoView({ block: "nearest" }); }
    else if (e.key === "Enter") pick(sel);
    else if (e.key === "Escape") { q.value = ""; out.classList.remove("open"); q.blur(); $("hdr").classList.remove("searching"); }
  });
  out.addEventListener("mousedown", e => { const r = e.target.closest("[data-k]"); if (r) { e.preventDefault(); pick(+r.dataset.k); } });
  q.addEventListener("blur", () => setTimeout(() => out.classList.remove("open"), 120));
  $("searchOpen").onclick = () => { $("hdr").classList.add("searching"); q.focus(); };
}

boot();
</script>
