<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner</title>
<!-- The Runner site shell (lanes/RUNNER-REDO/PLAN.md): header, map sidebar, routes feed / fn / stream / play.
     Every feed line is one typed event from /api/feed rendered by its kind's template from /api/contract; new and
     changed events arrive on /api/feed/stream (Server-Sent Events). Regions are modules under /static/site. -->
<style>
:root {
  --bg: #0d0e12; --surface: #15171d; --raised: #1e2129; --line: #2a2e38; --text: #eceef3; --dim: #969cab; --faint: #5d6372;
  --accent: #9d8cff; --accent-ink: #0d0e12; --good: #3fc35a; --bad: #ff5c5c; --warn: #d9a400; --hot: #ffe27a;
  --s-asm: #555555; --s-exact: #3b7ddd; --s-named: #1aa7a1; --b-ok: #3fc35a; --b-diff: #ff6b5c;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px; --gutter: 16px; --side: 340px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root {
  --bg: #f7f7fa; --surface: #ffffff; --raised: #eef0f4; --line: #dde0e7; --text: #13151b; --dim: #5b6070; --faint: #a3a8b5;
  --accent: #5b43d6; --accent-ink: #ffffff; --b-ok: #12793a; --b-diff: #d93a2b; --hot: #ff8a00; color-scheme: light; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--sans); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); }

/* header */
header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 var(--gutter);
  background: var(--bg); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 8px; font: 700 16px var(--mono); letter-spacing: -.01em; text-decoration: none; }
.logo svg { width: 20px; height: 20px; color: var(--accent); }
.search { position: relative; flex: 0 1 420px; }
.search input { width: 100%; height: 36px; padding: 0 12px 0 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--text); font: 14px var(--sans); outline: none; }
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 10px; top: 9px; color: var(--dim); }
.chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: var(--raised);
  font: 12px var(--mono); white-space: nowrap; text-decoration: none; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.chip.queued .dot { background: var(--warn); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; background: var(--accent);
  color: var(--accent-ink); font-weight: 600; text-decoration: none; }
.live { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); color: var(--dim); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.live.on i { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }

/* layout */
.frame { display: grid; grid-template-columns: var(--side) 1fr; height: calc(100% - 56px); }
aside { border-right: 1px solid var(--line); overflow: auto; padding: var(--gutter); }
main { overflow: auto; padding: var(--gutter) calc(var(--gutter) * 1.5); }
h2 { margin: 0 0 12px; font: 600 13px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
  display: flex; align-items: center; gap: 10px; }
.stub { border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px; color: var(--dim); background: var(--surface); }
.stub b { color: var(--text); font-family: var(--mono); }

/* feed */
.feed { list-style: none; margin: 0; padding: 0; max-width: 980px; }
.ev { display: grid; grid-template-columns: 76px 22px 1fr auto; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; }
.ev:nth-child(odd) { background: var(--surface); }
.ev time { font: 12px var(--mono); color: var(--faint); }
.ev .k { font: 11px var(--mono); color: var(--faint); }
.ev b { font-weight: 600; }
.ev a { color: var(--accent); text-decoration: none; }
.ev a:hover { text-decoration: underline; }
.ev .n { font-family: var(--mono); }
.ev[data-family="run.progress"] svg { color: var(--good); }
.ev[data-family="run.ended"] svg { color: var(--dim); }
.ev[data-family="run.refused"] svg, .ev[data-family="feedback.filed"] svg { color: var(--bad); }
.ev[data-family="function.matched"] svg { color: var(--s-named); }
.ev[data-family="case.diffed"] svg { color: var(--warn); }
.empty { color: var(--dim); padding: 24px 12px; }
@media (max-width: 820px) { .frame { grid-template-columns: 1fr; } aside { display: none; } .chips { display: none; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="#/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-6-6-6M12 19h8"/></svg>runner</a>
  <label class="search"><svg class="i"><use href="/static/icons.svg#i-search"/></svg><input id="q" placeholder="Filter the feed" autocomplete="off"></label>
  <nav class="chips" id="chips" aria-label="live runs"></nav>
  <span class="live" id="live"><i></i>offline</span>
  <a class="btn" href="#/play"><svg class="i"><use href="/static/icons.svg#i-gamepad-2"/></svg>New run</a>
</header>
<div class="frame">
  <aside id="side"></aside>
  <main id="view"></main>
</div>
<script type="module">
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) k === "class" ? (n.className = v) : n.setAttribute(k, v);
  n.append(...kids.filter(k => k != null));
  return n;
};
const icon = name => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("class", "i");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", `/static/icons.svg#i-${name}`); s.append(u); return s; };
async function api(path, init) {
  const r = await fetch(path, init);
  return r.json();
}

// ---------- the feed: events by id, rendered by their kind's template ----------
const S = { contract: null, events: new Map(), listeners: new Map(), q: "" };
const ICON = { "run.progress": "play", "run.queued": "hourglass", "run.ended": "circle-check", "run.refused": "circle-alert",
  "case.diffed": "columns-2", "function.matched": "code-xml", "feedback.filed": "radio" };
const family = kind => kind.split(":")[0];
const fmt = v => typeof v === "number" && Number.isInteger(v) ? v.toLocaleString("en-US") : String(v);
// One template -> nodes: the lane bold, a run's movie links to its stream, a target to its function, numbers in mono.
function line(ev) {
  const t = S.contract.templates[ev.kind], f = ev.fields, out = [];
  let last = 0;
  for (const m of t.matchAll(/\{(\w+)\}/g)) {
    out.push(t.slice(last, m.index)); last = m.index + m[0].length;
    const name = m[1], v = name === "lane" ? ev.lane : f[name];
    if (name === "lane") out.push(el("b", {}, v));
    else if (name === "movie" && f.run) out.push(el("a", { href: `#/stream/${encodeURIComponent(f.run)}` }, fmt(v)));
    else if (name === "target") out.push(el("a", { href: `#/fn/${encodeURIComponent(v)}` }, fmt(v)));
    else out.push(typeof v === "number" ? el("span", { class: "n" }, fmt(v)) : fmt(v));
  }
  out.push(t.slice(last));
  return out;
}
function textOf(ev) { return [ev.lane, ...Object.values(ev.fields)].join(" ").toLowerCase(); }
function renderFeed() {
  const list = $("#feed");
  const items = [...S.events.values()].sort((a, b) => b.at - a.at || (a.id < b.id ? -1 : 1))
    .filter(ev => !S.q || textOf(ev).includes(S.q));
  if (list) list.replaceChildren(...(items.length ? items.map(ev => el("li", { class: "ev", "data-family": family(ev.kind), "data-id": ev.id },
    el("time", { datetime: new Date(ev.at * 1000).toISOString() }, new Date(ev.at * 1000).toLocaleTimeString("en-GB", { hour12: false })),
    icon(ICON[family(ev.kind)] || "list"), el("span", {}, ...line(ev)), el("span", { class: "k" }, ev.kind))) : [el("li", { class: "empty" }, "No events yet.")]));
  const live = items.filter(ev => ev.kind.startsWith("run.progress") || ev.kind === "run.queued");
  $("#chips").replaceChildren(...live.map(ev => el("a", { class: `chip ${ev.kind === "run.queued" ? "queued" : ""}`, href: `#/stream/${encodeURIComponent(ev.fields.run)}` },
    el("i", { class: "dot" }), `${ev.lane} · ${ev.fields.movie} · ${fmt(ev.fields.poll)}`)));
}
function take(ev) { S.events.set(ev.id, ev); for (const fn of S.listeners.get(ev.kind) || []) fn(ev); }
function connect() {
  const src = new EventSource("/api/feed/stream");
  src.addEventListener("hello", () => { $("#live").className = "live on"; $("#live").lastChild.textContent = "live"; });
  src.addEventListener("feed", m => { take(JSON.parse(m.data)); renderFeed(); });
  src.onerror = () => { $("#live").className = "live"; $("#live").lastChild.textContent = "reconnecting"; };
}

// ---------- routes and regions ----------
const ctx = {
  get contract() { return S.contract; },
  api,
  go: route => { location.hash = `#/${route}`; },
  on: (kind, fn) => { if (!S.listeners.has(kind)) S.listeners.set(kind, []); S.listeners.get(kind).push(fn); },
  stub: (what, card) => el("div", { class: "stub" }, `The ${what} is not built yet: card `, el("b", {}, card), " fills this region."),
  route: null,
};
const REGION = { fn: "fn", stream: "stream", play: "play" };
function parse() {
  const [path, query = ""] = location.hash.replace(/^#\/?/, "").split("?");
  const [name = "", ...rest] = path.split("/");
  return { name, arg: decodeURIComponent(rest.join("/")), query: Object.fromEntries(new URLSearchParams(query)) };
}
async function show() {
  const r = ctx.route = parse(), view = $("#view");
  if (!REGION[r.name]) {
    view.replaceChildren(el("h2", {}, "Feed"), el("ul", { class: "feed", id: "feed" }));
    return renderFeed();
  }
  const mod = await import(`/static/site/${REGION[r.name]}.js`);
  view.replaceChildren();
  mod.mount(view, ctx);
}
async function boot() {
  S.contract = await api("/api/contract");
  const first = await api("/api/feed");
  for (const ev of first.events) S.events.set(ev.id, ev);
  (await import("/static/site/map.js")).mount($("#side"), ctx);
  $("#q").addEventListener("input", e => { S.q = e.target.value.trim().toLowerCase(); renderFeed(); });
  addEventListener("hashchange", show);
  await show();
  connect();
}
boot();
</script>
</body>
</html>
