name: ci
on:
  schedule:
    - cron: '23 4,16 * * *'
  workflow_dispatch:
concurrency:
  group: ci
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ci/format-check
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib ninja-build cmake
      - run: ci/check
