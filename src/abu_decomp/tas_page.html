<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>TAS</title>
<style>
  :root {
    --bg: #0d0e10; --panel: #131518; --raise: #181b1f; --line: #23262b; --soft: #1a1d21; --hover: #1d2025; --sel: #1b2a26;
    --fg: #d9dbde; --dim: #848a93; --faint: #50555d;
    --ok: #6fb39f; --warn: #d0a94f; --bad: #e0745f; --you: #7aa7e0;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --tap: 40px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .dim { color: var(--dim); } .faint { color: var(--faint); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .you { color: var(--you); }
  button { font: inherit; color: var(--fg); background: var(--raise); border: 1px solid var(--line); border-radius: 6px;
           min-height: 32px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--hover); border-color: var(--faint); }
  button.primary { background: #1f3a33; border-color: #2f5c50; color: #dff3ec; }
  button.primary:hover { background: #24463d; }
  button.danger { border-color: #5a2d26; color: #f2c3b9; }
  button.ghost { background: none; border-color: transparent; color: var(--dim); }
  button.ghost:hover { color: var(--fg); border-color: var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  button kbd { margin-left: 6px; }
  kbd { font: 11px var(--mono); color: var(--faint); }
  a { color: var(--ok); }
  .badge { display: inline-block; font: 11px/16px var(--mono); padding: 0 6px; border: 1px solid var(--line); border-radius: 9px;
           color: var(--dim); white-space: nowrap; vertical-align: 1px; }
  .badge.ok { color: var(--ok); border-color: #2f5c50; } .badge.bad { color: var(--bad); border-color: #5a2d26; }
  .badge.warn { color: var(--warn); border-color: #5c4a24; } .badge.you { color: var(--you); border-color: #2d4566; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px rgba(111, 179, 159, .18); }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .grow { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 0; }
  .sec { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .sec > .row:first-child { margin-bottom: 8px; }
  .empty { color: var(--dim); padding: 6px 0; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 8px 14px;
         padding-top: max(8px, env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--line); }
  .top .brand { font-weight: 700; letter-spacing: .08em; }
  .top .acts { display: flex; gap: 6px; }

  /* layout: stage + rail; desktop side by side, tablet stacked, phone one view at a time with a bottom bar */
  .app { display: block; }
  #watch { padding: 12px 14px 16px; min-width: 0; }
  .rail { border-top: 1px solid var(--line); min-width: 0; }
  .tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--line); position: sticky; top: 49px;
          background: var(--bg); z-index: 3; }
  .tabs button, .bottom button { background: none; border: 0; border-radius: 0; color: var(--dim); }
  .tabs button { border-bottom: 2px solid transparent; padding: 8px 12px; }
  .tabs button.on { color: var(--fg); border-bottom-color: var(--ok); }
  .tabs button .n, .bottom button .n { font: 11px var(--mono); color: var(--bad); margin-left: 4px; }
  .pane { display: none; } .pane.on { display: block; }
  .bottom { display: none; }
  @media (min-width: 1100px) {
    body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(380px, 40vw, 760px); }
    #watch { overflow: auto; }
    #mazeview { flex: 1; min-height: 0; overflow: auto; }
    .rail { border-top: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .tabs { position: static; }
    .panes { flex: 1; min-height: 0; overflow: auto; }
  }
  @media (max-width: 699px) {
    .top { padding-left: 10px; padding-right: 10px; }
    .top .wide { display: none; }
    .top input { width: 120px; }
    #watch { padding: 8px 10px 12px; }
    .tabs { display: none; }
    .rail { border-top: 0; }
    .app { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
    body[data-view="watch"] .rail { display: none; }
    body:not([data-view="watch"]) #watch { display: none; }
    .bottom { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel);
              border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .bottom button { flex: 1; min-height: 56px; padding: 6px 2px; font-size: 12px; }
    .bottom button.on { color: var(--fg); box-shadow: inset 0 2px 0 var(--ok); }
    .sec { padding: 12px 10px; }
  }

  /* stage */
  .stage-head { display: flex; align-items: flex-start; gap: 4px 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .stage-head .tline { flex-wrap: wrap; row-gap: 4px; }
  @media (max-width: 699px) { .stage-head .follow { order: -1; width: 100%; } }
  .stage-head .t { font-size: 16px; font-weight: 600; }
  .stage-head .s { color: var(--dim); font-size: 13px; }
  .follow { flex: none; }
  .screen { position: relative; width: 100%; margin: 0 auto; }

  canvas.pic { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; image-rendering: pixelated; border-radius: 4px;
               border: 1px solid var(--line); outline: none; touch-action: none; }
  canvas.pic.ctl { border-color: var(--you); box-shadow: 0 0 0 1px var(--you); }
  .screen .over { position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; pointer-events: none; }
  .screen .over span { background: rgba(0, 0, 0, .62); padding: 1px 7px; border-radius: 4px; font: 12px var(--mono); }
  .screen .stats { position: absolute; right: 8px; top: 8px; background: rgba(0, 0, 0, .62); padding: 1px 7px; border-radius: 4px;
                   font: 12px var(--mono); color: var(--dim); }
  .stage.empty .screen, .stage.empty .tl, .stage.empty .compare, .stage.empty .logbox { display: none !important; }
  .tl { margin: 8px auto 0; }
  @media (min-width: 700px) { .screen, .tl, .acts-row, .compare, .pad-wrap, .logbox, .live-wrap { width: min(100%, calc((100vh - 400px) * 4 / 3));
    width: min(100%, calc((100dvh - 400px) * 4 / 3)); min-width: 320px; margin-left: auto; margin-right: auto; } }
  #tl { display: block; width: 100%; height: 40px; cursor: pointer; touch-action: none; }
  .tl .lab { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--dim); gap: 8px; }
  .tl .lab b { color: var(--fg); font-weight: 500; }
  .acts-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  @media (max-width: 699px) { .acts-row button { flex: 1 1 auto; min-height: var(--tap); } .acts-row kbd { display: none; } }
  .compare { margin-top: 10px; display: none; }
  .compare.on { display: block; }
  .compare .pics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .compare figure { margin: 0; min-width: 0; }
  .compare canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; image-rendering: pixelated; border-radius: 3px;
                    border: 1px solid var(--line); }
  .compare figcaption { font: 11px var(--mono); color: var(--dim); margin-top: 2px; }
  .logbox { margin-top: 10px; border: 1px solid var(--line); border-radius: 6px; }
  .logbox summary { padding: 6px 10px; color: var(--dim); cursor: pointer; font-size: 13px; }
  #log { max-height: 240px; overflow: auto; padding: 2px 0 8px; font: 12px/1.45 var(--mono); position: relative; }
  #log div { padding: 0 10px; white-space: pre-wrap; word-break: break-word; }
  #latest { display: none; margin: 4px 10px 8px; } #latest.on { display: inline-block; }

  /* touch pad: shown while you drive a run on a touch screen (or when asked) */
  .pad-wrap { display: none; margin-top: 10px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .pad-wrap.on { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .stick { width: 132px; height: 132px; border-radius: 50%; background: var(--raise); border: 1px solid var(--line); position: relative; flex: none; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: #2a2e34; }
  .pbtns { display: grid; grid-template-columns: repeat(4, 48px); gap: 8px; }
  .pbtns button { height: 48px; min-height: 48px; padding: 0; border-radius: 50%; font-weight: 600; }
  .pbtns button.wide { border-radius: 10px; }
  .pbtns button.down { background: #2f5c50; }

  /* live strip and recent */
  .strip-head { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; }
  .strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  @media (max-width: 699px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
  .tile { cursor: pointer; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px; }
  .tile:hover { border-color: var(--faint); }
  .tile canvas, .tile img { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; image-rendering: pixelated; border-radius: 3px; }
  .tile .cap { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 12px; }
  .tile .meta { font: 11px var(--mono); color: var(--dim); display: flex; gap: 6px; overflow: hidden; white-space: nowrap; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }

  /* lists in the rail */
  .item { padding: 9px 0; border-top: 1px solid var(--soft); min-width: 0; }
  .item:first-of-type { border-top: 0; }
  .item.click { cursor: pointer; } .item.click:hover { background: var(--soft); } .item.sel { background: var(--sel); }
  .item .l1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .l2 { font: 12px var(--mono); color: var(--dim); margin-top: 2px; overflow-wrap: anywhere; }
  .item .btns { display: flex; gap: 6px; flex: none; }
  .item .btns button { min-height: 28px; padding: 2px 9px; }
  .item.first { background: linear-gradient(90deg, rgba(111, 179, 159, .08), transparent); margin: 0 -14px; padding: 10px 14px; }
  .cmd { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .cmd code { flex: 1; min-width: 0; font: 12px var(--mono); background: var(--raise); border: 1px solid var(--line); border-radius: 5px;
              padding: 4px 8px; overflow-x: auto; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chips button, .filters button { min-height: 26px; padding: 1px 10px; border-radius: 13px; font-size: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .filters button.on { border-color: var(--ok); color: var(--ok); }
  .kids { margin: 4px 0 0 14px; border-left: 2px solid var(--line); padding-left: 10px; }
  .day { font-size: 12px; color: var(--faint); margin: 12px 0 2px; }
  .ver { padding: 10px 0; border-top: 1px solid var(--soft); }
  .ver:first-of-type { border-top: 0; }
  .ver .big { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); margin: 6px 0 4px; }
  .pbar i { display: block; height: 100%; } .pbar .e { background: var(--ok); } .pbar .f { background: var(--warn); } .pbar .n { background: var(--bad); }
  svg.spark { display: block; flex: none; }
  .star { min-height: 26px; padding: 0 7px; font-size: 14px; }
  .star.on { color: var(--warn); border-color: #5c4a24; }

  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 0;
           width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog .dh { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  dialog .dh b { flex: 1; }
  dialog .db { padding: 6px 14px 16px; }
  dialog .opt { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 0; border-top: 1px solid var(--soft); }
  dialog .opt > span:first-child { width: 120px; color: var(--dim); }
  dialog label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; min-height: 28px; }
  dialog table { width: 100%; border-collapse: collapse; font-size: 13px; }
  dialog td, dialog th { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--soft); }
  dialog th { color: var(--dim); font-weight: 400; }
  dialog h3 { font-size: 12px; color: var(--dim); font-weight: 500; margin: 14px 0 4px; }

  /* coverage maze (top-level view beside the watch page) and the function search */
  #mazeview { display: none; padding: 12px 14px 80px; min-width: 0; }
  body[data-top="maze"] #mazeview { display: block; }
  body[data-top="maze"] main.app { display: none; }
  body[data-top="maze"] .bottom button.keep { }
  .top form { display: flex; gap: 4px; }
  .top input { font: inherit; color: var(--fg); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; min-height: 32px; width: 170px; }
  .top .toplink { background: none; border-color: transparent; color: var(--dim); }
  .top .toplink.on { color: var(--fg); border-color: var(--line); }
  .mz-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  @media (min-width: 900px) { .mz-grid { grid-template-columns: minmax(240px, 330px) minmax(0, 1fr); align-items: start; } }
  @media (max-width: 899px) { .mz-left { order: 2; } .mz-tiles { max-height: 320px; } }
  .mz-actions { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .mz-tiles { display: grid; gap: 6px; overflow: auto; max-height: calc(100vh - 220px); }
  .mz-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; min-width: 0; }
  .mz-tile:hover { background: var(--hover); border-color: var(--faint); }
  .mz-tile.on { border-color: var(--ok); background: var(--sel); }
  .mz-tile.red .n { color: var(--dim); }
  .mz-tile .n { font-size: 13px; font-weight: 600; }
  .mz-big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mz-bar { height: 6px; background: var(--soft); border-radius: 3px; margin: 8px 0; overflow: hidden; }
  .mz-bar i { display: block; height: 100%; background: var(--ok); }
  .mz-wrap { position: relative; width: 100%; overflow: hidden; }
  .mz-wrap canvas { display: block; }
  .mz-tip { position: absolute; z-index: 4; pointer-events: none; background: #000d; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px;
            font: 12px var(--mono); white-space: pre; max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
  .mz-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0; font: 12px var(--mono); color: var(--dim); }
  .mz-legend i, .cd { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .mz-panel { border-top: 1px solid var(--line); padding-top: 10px; }
  .mz-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 6px 0; }
  .mz-row { display: flex; align-items: center; gap: 8px; min-height: 28px; min-width: 0; }
  .mz-row a { min-width: 0; }
  .mz-row .sm { min-height: 28px; min-width: 32px; padding: 0 6px; }
  .mz-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 6px 0 2px; }
  .mz-self { padding: 6px 8px; margin: 6px 0; border: 1px solid var(--ok); border-radius: 6px; background: var(--sel); overflow-wrap: anywhere; }
  .mz-path { margin: 6px 0; color: var(--dim); overflow-wrap: anywhere; }
  /* video wall (under the stage) and phase map (rail tab) */
  .live-wrap { width: 100%; max-width: none; }
  .wall-head { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  @media (max-width: 699px) { .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
  .tile.sel { border-color: var(--ok); }
  .tile.grey canvas { filter: grayscale(1) brightness(.7); }
  .tile .pics { display: grid; gap: 2px; }
  .tile .pics canvas.orig { border-top: 1px solid var(--line); }
  .tile .sub { font: 11px var(--mono); color: var(--warn); }
  .slot { aspect-ratio: 4 / 3; border: 1px dashed var(--soft); border-radius: 6px; }
  .mp { padding: 12px 14px; min-width: 0; }
  .mp .gate { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); padding: 2px 0; }
  .mp .gate .tick { width: 14px; flex: none; text-align: center; }
  .mp .ladder { margin: 8px 0; }
  .mp .release { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 8px 0; font: 12px var(--mono); }
  .mp .release h2 { margin: 0; }
  .mp .release .rel { display: inline-flex; align-items: center; gap: 6px; }
  .mp .wrapc { position: relative; width: 100%; margin-top: 8px; }
  #mapc { display: block; width: 100%; aspect-ratio: 1 / 1; background: #222; image-rendering: pixelated; border: 1px solid var(--line); }
  .mp .bar1 { height: 6px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .mp .bar1 i { display: block; height: 100%; background: #6b7280; }
  .mp .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 0; font: 11px var(--mono); color: var(--dim); }
  .mp .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #maptip { position: absolute; z-index: 4; pointer-events: none; background: #000d; border: 1px solid var(--line); border-radius: 4px;
            padding: 4px 8px; font: 12px var(--mono); white-space: pre; max-width: 300px; overflow: hidden; text-overflow: ellipsis; display: none; }
  /* #film: wall + map full screen, no chrome, no settings */
  body[data-top="film"] { overflow: hidden; }
  body[data-top="film"] .top, body[data-top="film"] .bottom, body[data-top="film"] .tabs,
  body[data-top="film"] .stage-head, body[data-top="film"] .screen, body[data-top="film"] .tl, body[data-top="film"] .acts-row,
  body[data-top="film"] .pad-wrap, body[data-top="film"] .compare, body[data-top="film"] .logbox, body[data-top="film"] .wall-head,
  body[data-top="film"] .mp .gates, body[data-top="film"] .mp .legend, body[data-top="film"] .mp .bar1 { display: none !important; }
  body[data-top="film"] { height: 100vh; height: 100dvh; display: block; }
  body[data-top="film"] .app { display: grid; grid-template-columns: 60fr 40fr; height: 100vh; height: 100dvh; padding: 0; }
  body[data-top="film"] #watch { padding: 6px; overflow: hidden; }
  body[data-top="film"] .live-wrap { width: 100%; margin: 0; }
  body[data-top="film"] .wall { margin: 0; gap: 6px; }
  body[data-top="film"] .rail { border: 0; }
  body[data-top="film"] .panes { overflow: hidden; }
  body[data-top="film"] .mp { padding: 6px; }
  body[data-top="film"] .mp .wrapc { margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body data-view="watch">
<header class="top">
  <span class="brand">TAS</span>
  <span id="build" class="mono dim ell wide"></span>
  <button id="mazebtn" class="toplink wide" title="Game code coverage maze">Maze</button>
  <form id="fnfind" title="Open the per-function page"><input id="fnq" placeholder="function name" autocomplete="off" spellcheck="false" aria-label="function name"></form>
  <span class="grow"></span>
  <span id="conn" class="dot" title="connected"></span>
  <span class="acts">
    <button id="newrun" class="primary" title="Your own run: fresh boot, your keyboard / gamepad / touch, saved as a movie (n)">New run</button>
    <button id="all" title="Replay every movie at turbo (a)">Play all</button>
    <button id="setbtn" class="ghost" title="Settings and controls">⚙</button>
  </span>
</header>
<main class="app">
  <section id="watch">
    <div id="stage" class="stage empty">
      <div class="stage-head">
        <div class="grow">
          <div class="row tline"><span id="stitle" class="t ell"></span><span id="sbadges" class="row" style="flex-wrap:wrap;gap:4px"></span></div>
          <div id="sline" class="s"></div>
        </div>
        <span id="follow" class="follow"></span>
      </div>
      <div class="screen">

</main>
<section id="mazeview"></section>

  <div class="dh"><b>Settings</b><button class="ghost" data-close>✕</button></div>
  <div class="db">

      <label><input type="radio" name="scope" value="all"> every live run</label><label><input type="radio" name="scope" value="focus"> the run on stage</label></div>
    <div class="opt"><span>sound from</span>
      <label><input type="radio" name="side" value="port"> the port</label><label><input type="radio" name="side" value="oracle"> the original</label></div>

      <label><input type="checkbox" id="orig"> replays I start also run the original game beside the port</label></div>

      <label title="8 MB RDRAM; off is the 4 MB console"><input type="checkbox" id="pak"> Expansion Pak</label>
      <label title="your save card, kept between your runs; off is an empty slot"><input type="checkbox" id="cpak"> Controller Pak</label>
      <label title="draw extra pictures between game frames and present as fast as this host allows, for every run you start; the game, its timing and the recorded state are the same with it on or off"><input type="checkbox" id="fps"> Framerate unlock</label>
      <label title="begin at a place in the game (menus, areas) instead of power-on: the game's own inputs and saves, replayed"><select id="startpt"><option value="">start: power on</option></select></label></div>

    <div id="ctlbody"></div>

</dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
function el(tag, cls, ...kids) {

  return e;
}
const sleep = ms => new Promise(ok => setTimeout(ok, ms));
const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
  .then(r => r.json()).catch(() => ({ error: "server unreachable" }));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const OUT = { ok: "ok", stop: "warn", crash: "bad", hang: "bad", exit: "warn", refused: "bad" };
const BAD = new Set(["stop", "crash", "hang", "exit", "refused"]);
const failed = r => r.status === "done" && !r.stopped && BAD.has(r.outcome);  // a run stopped from the page is no fault
const endText = r => r.stopped ? "stopped" : r.outcome || "ended";
const endClass = r => r.stopped ? "" : OUT[r.outcome] || "";
const reach = r => r.polls && r.poll <= r.polls ? `${r.poll}/${r.polls}` : `${r.poll} polls`;
const TABS = [["map", "Map"], ["work", "Work"], ["decomp", "Decomp"], ["lanes", "Lanes"], ["runs", "Runs"]];
const STRIP_MS = 220, MAX_LOG = 3000;

let S = null, BD = null, CV = null, CP = null, skew = 0;
const H = { rows: [], more: false, at: 0, busy: false, filter: store.get("tas.filter", "all") };
const F = { id: null, run: null, follow: true, cursor: null, cursorFor: null };
const ui = { view: "watch", tab: store.get("tas.tab", "map"), open: new Set(), covTab: "oracle_only" };
const now = () => Date.now() / 1000 + skew;
const isPhone = () => matchMedia("(max-width: 699px)").matches;
function ago(t) {
  if (t == null) return "—";
  const s = Math.max(0, Math.round(now() - t));
  return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`;
}
function clock(polls) {
  const s = polls / 60;
  return s < 60 ? `${s.toFixed(1)} s` : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
}
const speedText = v => v === 0 ? "turbo" : `${v}x`;
const pct = v => v == null ? "—" : `${(100 * v).toFixed(v < 0.1 ? 1 : 0)}%`;
const diffClass = v => v == null ? "dim" : v < 0.05 ? "ok" : v < 0.25 ? "warn" : "bad";
const badge = (text, cls, title) => { const b = el("span", "badge" + (cls ? " " + cls : ""), text); if (title) b.title = title; return b; };
function btn(label, fn, cls, key, title) {
  const b = el("button", cls || "", label);
  if (key) b.append(el("kbd", "", key));
  if (title) b.title = title;
  b.onclick = e => { e.stopPropagation(); fn(); };
  return b;
}

/* ---------- data: /api/state (live), /api/board (slow side), /api/coverage, /api/runs (history pages) ---------- */
async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    S = await r.json();
    skew = S.now - Date.now() / 1000;
    $("conn").className = "dot ok"; $("conn").title = "connected";
  } catch (e) {
    $("conn").className = "dot bad"; $("conn").title = "server unreachable: " + e;
  }
  if (S) render();
  setTimeout(poll, S && S.runs.some(r => r.status !== "done") ? 500 : 1500);
}
async function pollBoard() {
  try { const r = await fetch("/api/board", { cache: "no-store" }); if (r.ok) BD = await r.json(); } catch (e) {}
  if (S) renderPanes();
  setTimeout(pollBoard, BD && BD.work && BD.work.rows == null ? 4000 : 15000);
}
async function pollCorpus() {
  try { const r = await fetch("/api/corpus", { cache: "no-store" }); if (r.ok) CP = await r.json(); } catch (e) {}
  setTimeout(pollCorpus, CP && CP.gating ? 5000 : 30000);
}
async function pollCoverage() {
  try { const r = await fetch("/api/coverage", { cache: "no-store" }); if (r.ok) CV = await r.json(); } catch (e) {}
  setTimeout(pollCoverage, 30000);
}
async function loadHistory(older) {
  if (H.busy) return;

  try {
    const last = older && H.rows.length ? H.rows[H.rows.length - 1].started : null;
    const r = await fetch("/api/runs?limit=60" + (last != null ? `&before=${last}` : ""), { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      if (older) H.rows = H.rows.concat(d.runs);
      else { const keep = H.rows.slice(d.runs.length); const ids = new Set(d.runs.map(x => x.id)); H.rows = d.runs.concat(keep.filter(x => !ids.has(x.id))); }
      if (older || !H.loaded) H.more = d.more;

    }
  } catch (e) {}

  renderPanes();
}
function findRun(id) {
  if (!id) return null;
  return (S && S.runs.find(r => r.id === id)) || H.rows.find(r => r.id === id) || (F.run && F.run.id === id ? F.run : null);
}
const liveRuns = () => S ? S.runs.filter(r => r.status === "running") : [];
const humanRun = () => liveRuns().find(r => r.input === "human") || null;

function render() {
  const b = S.build || {};
  $("build").textContent = b.pin ? `port of RW ${String(b.pin).slice(0, 9)} · built ${ago(b.built)} · ${fmtText(b)}` : "no build";
  $("build").title = b.port || "";
  pickFollow();
  renderStage(); renderStrip(); renderPanes(); renderNav(); followAudio(); followLog();
}

/* ---------- focus: the stage follows the newest live run (yours first) until you pick one ---------- */
function pickFollow() {
  if (!F.follow) return;
  const live = liveRuns().sort((a, b) => b.started - a.started);
  const want = humanRun() || live[0];
  if (want) { if (want.id !== F.id) setFocus(want.id, true); return; }
  if (!F.id) {
    const done = S.runs.filter(r => r.status === "done").sort((a, b) => b.started - a.started)[0];
    if (done) setFocus(done.id, true);
  }
}
function setFocus(id, auto) {
  if (!auto) F.follow = false;
  if (F.id === id) return;
  F.id = id; F.run = findRun(id); F.cursor = null; F.cursorFor = null;
  ST.gen++; Object.assign(ST, { stamp: 0, frames: [], lat: [], gotSeq: 0, has: false, miss: 0 });
  const g = $("scr").getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, 320, 240);
  if (id) stageFrames(ST.gen);
}
function focusRun(id) { setFocus(id, false); if (isPhone()) showView("watch"); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function followLive() { F.follow = true; pickFollow(); render(); }

/* ---------- stage picture: long-poll /frame?after=<stamp> while live; a finished run shows its last picture ---------- */
const ST = { gen: 0, stamp: 0, frames: [], lat: [], gotSeq: 0, has: false, miss: 0 };
async function stageFrames(gen) {
  const g = $("scr").getContext("2d");
  g.imageSmoothingEnabled = false;
  while (gen === ST.gen && F.id) {
    const run = findRun(F.id), live = !!run && run.status !== "done";
    try {
      const r = await fetch(`/frame/${encodeURIComponent(F.id)}` + (live ? `?after=${ST.stamp}` : `?n=${Date.now()}`), { cache: "no-store" });
      if (gen !== ST.gen) return;

        ST.stamp = +r.headers.get("X-Frame") || ST.stamp;
        const seq = +r.headers.get("X-Input-Seq") || 0, bmp = await createImageBitmap(await r.blob());
        if (gen !== ST.gen) return;
        g.drawImage(bmp, 0, 0, 320, 240); ST.has = true; ST.miss = 0;
        const t = performance.now();
        ST.frames.push(t);
        while (ST.frames.length && t - ST.frames[0] > 2000) ST.frames.shift();
        if (seq > ST.gotSeq) { if (P.sent.has(seq)) { ST.lat.push(t - P.sent.get(seq)); if (ST.lat.length > 30) ST.lat.shift(); } ST.gotSeq = seq; }
      } else if (r.status !== 204) { ST.miss++; await sleep(live ? 400 : 1000); }
    } catch (e) { await sleep(700); }
    if (!live && (ST.has || ST.miss > 3)) return;
  }
}

function median(v) { if (!v.length) return null; const s = v.slice().sort((a, b) => a - b); return s[s.length >> 1]; }
function runTitle(r) { return r.movie || r.id; }
function runBadges(r) {
  const out = [];
  if (r.status === "queued") out.push(badge("queued"));
  else if (r.status === "running") out.push(badge(r.input === "human" ? "you" : speedText(r.speed), r.input === "human" ? "you" : "ok"));
  else out.push(badge(endText(r), endClass(r)));
  if (r.label && r.label !== "owner") out.push(badge(r.label, "", "started by this lane"));
  if (r.from) out.push(badge(`retry @${r.at}`, "you", `retry of run ${r.from} from poll ${r.at}`));
  else if (r.took_at != null) out.push(badge(`taken @${r.took_at}`, "you", "live input took this replay over at that poll"));
  if (r.pak === "off") out.push(badge("4 MB", "", "no Expansion Pak"));
  if (r.fps_unlock) out.push(badge(r.shown ? `${Math.round(r.shown.presented_per_s)} fps` : "unlocked", "", "framerate unlock" + (r.shown ? `: ${r.shown.presented_per_s} pictures/s shown for ${r.shown.game_per_s} game frames/s` : "")));
  if (r.cpak && r.cpak !== "none") out.push(badge("cpak", "", "Controller Pak: " + r.cpak.slice(0, 12)));
  if (r.pinned) out.push(badge("kept", "warn", "pinned: never archived"));
  if (r.oracle && r.oracle.max_diff != null) out.push(badge(`Δ${pct(r.oracle.max_diff)}`, diffClass(r.oracle.max_diff), `worst ${pct(r.oracle.max_diff)} at poll ${r.oracle.max_poll} vs the original`));
  return out;
}
function statusLine(r) {
  if (r.status === "queued") return "queued: starts when a replay slot is free";
  if (r.status === "running") {
    if (r.input === "human") return `poll ${r.poll}` + (r.from && r.poll < r.at ? ` · replaying to poll ${r.at} at turbo, then it is yours` : controlling() ? " · you are in control" : " · live input");
    return `poll ${r.poll} of ${r.polls} · ${speedText(r.speed)}` + (r.label ? ` · ${r.label}` : "");
  }
  const parts = [`${endText(r)} at poll ${r.poll}` + (r.polls && r.poll <= r.polls ? ` of ${r.polls}` : "")];
  if (r.subject && !r.stopped) parts.push(r.subject);
  if (r.saved) parts.push(`saved as ${r.saved}`);
  parts.push(ago(r.ended || r.started));
  return parts.join(" · ");
}
function defaultCursor(r) {
  if (r.status !== "done") return null;
  if (r.from) return r.at;
  if (r.took_at != null) return r.took_at;
  if (failed(r)) return Math.max(0, r.poll - 120);
  return r.poll;
}
function renderStage() {
  const r = F.id ? findRun(F.id) : null;
  if (r) F.run = r;
  $("stage").classList.toggle("empty", !r);
  if (!r) {
    $("stitle").textContent = "Nothing has run yet";
    $("sline").textContent = "New run (n) starts your own · Play all (a) replays every movie";
    $("sbadges").replaceChildren(); $("acts").replaceChildren(); $("follow").replaceChildren(); $("compare").classList.remove("on");
    return;
  }
  if (F.cursorFor !== r.id + r.status) { F.cursor = defaultCursor(r); F.cursorFor = r.id + r.status; }
  $("stitle").textContent = runTitle(r);
  $("stitle").title = `${r.id}\n${r.port || ""}`;
  $("sbadges").replaceChildren(...runBadges(r));
  $("sline").textContent = statusLine(r);
  $("sline").className = "s " + (r.status === "done" ? endClass(r) || "dim" : "");
  $("follow").replaceChildren(F.follow
    ? el("span", "row dim", el("span", "dot live"), "following live")
    : btn("Follow live", followLive, "ghost", "f", "the stage jumps to the newest live run"));
  const live = r.status === "running";
  const ctl = controlling();
  $("scr").classList.toggle("ctl", ctl);
  const n = ST.frames.length, fps = n > 1 ? (n - 1) * 1000 / (ST.frames[n - 1] - ST.frames[0]) : 0, lat = median(ST.lat);
  $("stats").hidden = !live;
  $("stats").textContent = `${fps ? fps.toFixed(0) : "–"} fps` + (r.input === "human" ? ` · input→frame ${lat == null ? "–" : Math.round(lat) + " ms"}` : "");
  $("sover").hidden = !ctl;
  $("sover").textContent = runPads() > 1 ? `you drive pad ${P.pad + 1} of ${runPads()} (keys 1-${runPads()} switch)` : "you drive this run";
  renderActions(r);
  drawTimeline(r);
  renderPad(ctl);
  renderCompare(r);
}
function renderActions(r) {
  const a = [];
  const movieKnown = name => S.movies.some(m => m.name === name);
  if (r.status === "running" && r.input !== "human") {
    a.push(btn("Take over", () => takeRun(r), "primary", "t", "from the next poll this run follows your keyboard / gamepad / touch (recorded, saved as a branch)"));
    a.push(btn("Stop", () => post("/api/stop", { id: r.id }), "danger", "x"));
  } else if (r.status === "running") {
    a.push(btn("Stop and save", () => post("/api/stop", { id: r.id }), "danger", "x", "end your run; its polls are saved as a movie"));
    a.push(btn("Controls", () => openSettings(), "ghost", "?"));
  } else if (r.status === "done") {
    const c = F.cursor == null ? r.poll : F.cursor;
    a.push(btn(`Retry from poll ${c}`, () => retry(r, c), "primary", "r",
      `replay this run to poll ${c} at turbo, then you drive it from exactly there (pick another poll on the timeline)`));
    const again = r.saved && movieKnown(r.saved) ? r.saved : movieKnown(r.movie) ? r.movie : null;
    if (again) {
      a.push(btn(r.saved ? "Replay my attempt" : "Replay", () => play(again, 1), "", "space", `play movie ${again} again at 1x`));
      a.push(btn("Turbo", () => play(again, 0), "ghost", null, `play movie ${again} again at turbo`));
    }
    a.push(btn(r.pinned ? "Unpin" : "Pin", () => pinRun(r), "ghost", "p", "a pinned run is never archived"));
  }
  $("acts").replaceChildren(...a);
}

/* ---------- timeline: one bar for the whole run (progress, take point, fault, the per-poll diff vs the original) ---------- */
function timelineSpan(r) { return Math.max(1, r.polls || 0, r.poll || 0); }
function drawTimeline(r) {
  const c = $("tl"), w = Math.max(100, c.clientWidth), h = 40, dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext("2d"), css = getComputedStyle(document.documentElement), v = k => css.getPropertyValue(k).trim();
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const T = timelineSpan(r), x = p => Math.round(4 + (w - 8) * Math.min(1, p / T));
  const rows = O.id === r.id ? O.rows : [];
  if (rows.length) {
    const bw = Math.max(1, Math.floor((w - 8) * (O.every || 1) / T));
    for (const d of rows) { g.fillStyle = v(d.diff < 0.05 ? "--ok" : d.diff < 0.25 ? "--warn" : "--bad"); const bh = Math.max(1, Math.round(Math.min(1, d.diff * 2) * 12)); g.fillRect(x(d.poll), 14 - bh, bw, bh); }
  }
  g.fillStyle = v("--line"); g.fillRect(4, 18, w - 8, 6);
  g.fillStyle = r.status === "done" ? v("--faint") : v("--ok"); g.fillRect(4, 18, x(r.poll) - 4, 6);
  const took = r.from ? r.at : r.took_at;
  if (took != null) { g.fillStyle = v("--you"); g.fillRect(x(took) - 1, 15, 2, 12); g.fillRect(x(took), 15, 6, 4); }
  if (failed(r)) { g.fillStyle = v("--bad"); g.beginPath(); g.arc(x(r.poll), 21, 4.5, 0, 7); g.fill(); }
  if (F.cursor != null) {
    g.fillStyle = v("--fg"); g.fillRect(x(F.cursor) - 1, 2, 2, 34);
    g.beginPath(); g.moveTo(x(F.cursor) - 5, 36); g.lineTo(x(F.cursor) + 5, 36); g.lineTo(x(F.cursor), 30); g.fill();
  }
  $("tl0").textContent = "0";
  $("tl1").textContent = `${T} · ${clock(T)}`;
  const lab = $("tlc");
  if (F.cursor != null) {
    lab.replaceChildren(el("b", "", `poll ${F.cursor}`), ` · ${clock(F.cursor)}`);
    const d = rows.length ? nearest(rows, F.cursor) : null;
    if (d) lab.append(` · ${pct(d.diff)} differs @${d.poll}`);
  } else lab.textContent = r.status === "done" ? "" : "live";
}
function nearest(rows, p) { return rows.reduce((a, b) => Math.abs(b.poll - p) < Math.abs(a.poll - p) ? b : a); }
(function timelineInput() {
  const c = $("tl");
  let down = false;
  const at = e => { const r = findRun(F.id); if (!r) return; const b = c.getBoundingClientRect(), T = timelineSpan(r);
    const maxp = r.status === "done" ? r.poll : T;
    F.cursor = Math.max(0, Math.min(maxp, Math.round(((e.clientX - b.left - 4) / (b.width - 8)) * T)));
    if (O.id === r.id && O.rows.length) { O.follow = false; O.poll = nearest(O.rows, F.cursor).poll; }
    renderStage(); };
  c.addEventListener("pointerdown", e => { down = true; c.setPointerCapture(e.pointerId); at(e); });
  c.addEventListener("pointermove", e => { if (down) at(e); });
  c.addEventListener("pointerup", () => { down = false; });
})();
function nudge(d) { const r = findRun(F.id); if (!r || r.status !== "done") return; F.cursor = Math.max(0, Math.min(r.poll, (F.cursor ?? r.poll) + d)); renderStage(); }

/* ---------- the original game beside the port (runs with the oracle): pictures at the picked poll + diff ---------- */
const O = { on: store.get("tas.oracle", "off") === "on", id: null, rows: [], every: 1, poll: null, follow: true, shown: "", busy: false, at: 0 };
function renderCompare(r) {
  const box = $("compare");
  box.classList.toggle("on", !!r.oracle);
  if (!r.oracle) { if (O.id) O.id = null; return; }
  if (O.id !== r.id) Object.assign(O, { id: r.id, rows: [], poll: null, follow: F.cursor == null, shown: "", at: 0 });
  const o = r.oracle;
  if (!O.busy && (!O.rows.length || (o.status === "running" || r.status === "running") && performance.now() - O.at > 1000)) loadDiff(r.id);
  if (O.follow && O.rows.length) O.poll = O.rows[O.rows.length - 1].poll;

  const r = $("mzwrap").getBoundingClientRect();

function mazeStats() {
  const d = MZ.data, { lit, ms } = litSet();
  let n = 0;
  for (let i = 0; i < lit.length; i++) n += lit[i];
  const pctv = (100 * n / d.total).toFixed(1);
  return { n, pct: pctv, text: `${pctv}% covered · ${n} of ${d.total} fns` + (ms.length < d.replays.length ? ` · ${ms.length} replay${ms.length === 1 ? "" : "s"}` : "") };
}
function renderMaze() {
  const root = $("mazeview"), d = MZ.data;
  if (document.body.dataset.top !== "maze") return;
  if (!d) { root.replaceChildren(el("div", "sec", el("div", "empty", "no coverage table yet (tas play --all writes it)"))); return; }

}
function buildMaze(root) {
  const count = el("span", "mono dim"); count.id = "mzcount";
  const play = btn("▶ Play", () => togglePlay(), "primary"); play.id = "mzplay";
  const tiles = el("div", "mz-tiles"); tiles.id = "mztiles";
  const left = el("div", "mz-left", el("div", "row", el("h2", "", "Replays"), el("span", "grow"), count),
    el("div", "mz-actions", btn("All", () => { MZ.sel.clear(); stopPlay(); renderMaze(); }, "", null, "light the union of every replay"),
      btn("None", () => { MZ.sel = new Set([-1]); stopPlay(); renderMaze(); }), play), tiles);
  const head = el("div", "mz-head"); head.id = "mzhead";
  const cv = el("canvas"); cv.id = "mzc";
  const tip = el("div", "mz-tip"); tip.id = "mztip"; tip.hidden = true;
  const wrap = el("div", "mz-wrap", cv, tip); wrap.id = "mzwrap";
  const lg = (rgb, text) => { const s = el("span", "lg", el("i")); s.firstChild.style.background = `rgb(${rgb})`; s.append(" " + text); return s; };
  const legend = el("div", "mz-legend", lg(STATE_RGB.exact, "exact C"), lg(STATE_RGB.fuzzy, "fuzzy C"), lg(STATE_RGB.none, "no C"),
    lg(MAZE_UNIQUE, "only this replay"), el("span", "lg dim", "faint = not covered"));
  const panel = el("div", "mz-panel"); panel.id = "mzpanel";
  root.replaceChildren(el("div", "mz-grid", left, el("div", "mz-right", head, wrap, legend, panel)));
  cv.onmousemove = ev => { const i = cellAt(ev); cv.style.cursor = i >= 0 ? "pointer" : "default"; mazeTip(i, ev); };
  cv.onmouseleave = () => mazeTip(-1);

}
window.addEventListener("resize", () => { if (document.body.dataset.top === "maze" && MZ.data) drawMaze(); });
function renderMazeHead() {
  const d = MZ.data, st = mazeStats();
  const bar = el("div", "mz-bar", el("i"));
  bar.firstChild.style.width = st.pct + "%";
  $("mzhead").replaceChildren(el("div", "mz-big", st.text),
    el("div", "mono dim", `real C ${d.real_pct}% of ${d.total} game fns · every replay together ${d.covered_pct}% · ${(100 - st.pct).toFixed(1)}% to 100% from here · ${d.version || ""}` +
      (d.exact ? "" : " · per-replay sets are first-hit only until the next tas play --all")), bar);
}
function renderTiles() {
  const d = MZ.data;
  $("mzcount").textContent = `${d.replays.length} movies`;
  const order = d.replays.map((_, i) => i).sort((a, b) => d.replays[b].cells.length - d.replays[a].cells.length);
  $("mztiles").replaceChildren(...order.map(m => {
    const r = d.replays[m];
    const t = el("div", "mz-tile" + (MZ.sel.has(m) ? " on" : "") + (r.redundant && d.exact ? " red" : ""),
      el("div", "n ell", r.name), el("div", "mono dim ell", `${r.start} · ${r.status}`),
      el("div", "mono", `${r.cells.length} fns`, el("span", "dim", ` · ${r.unique} only here `), r.redundant && d.exact ? el("span", "badge warn", "redundant") : null));
    t.title = r.name;
    t.onmouseenter = () => { MZ.hover = m; drawMaze(); renderMazeHead(); };
    t.onmouseleave = () => { MZ.hover = -1; drawMaze(); renderMazeHead(); };
    t.onclick = () => {
      stopPlay(); MZ.sel.delete(-1);
      if (MZ.sel.has(m)) MZ.sel.delete(m); else MZ.sel.add(m);

}
function stopPlay() { if (MZ.player) { clearInterval(MZ.player); MZ.player = null; } const b = document.getElementById("mzplay"); if (b) b.firstChild.textContent = "▶ Play"; }
function togglePlay() {
  if (MZ.player) { stopPlay(); return; }
  const d = MZ.data;
  let k = 0;
  MZ.sel = new Set([-1]);
  $("mzplay").firstChild.textContent = "■ Stop";
  const step = () => {
    if (k >= d.greedy.length) { stopPlay(); return; }
    const o = d.greedy[k++];
    MZ.sel.delete(-1); MZ.sel.add(o.m); MZ.hover = -1;
    renderTiles(); renderMazeHead(); drawMaze();
    $("mzhead").firstChild.textContent += `  +${o.gain} from ${d.replays[o.m].name}${o.gain === 0 ? " (redundant)" : ""}`;
  };
  step();
  MZ.player = setInterval(step, 700);
}
/* the call tree of one function: callers above, callees below, one level per click */
function currentMovie() {
  const picked = [...MZ.sel].filter(m => m >= 0);
  return picked.length === 1 ? MZ.data.replays[picked[0]].name : "";
}
function callsOf(name) {
  const key = name + "|" + currentMovie();
  if (!MZ.tree.has(key)) MZ.tree.set(key, fetch(`/api/calls/${encodeURIComponent(name)}?movie=${encodeURIComponent(currentMovie())}`, { cache: "no-store" }).then(r => r.json()).catch(() => null));
  return MZ.tree.get(key);
}
function nodeRow(n, dir, depth) {
  const wrap = el("div", "mz-node"), by = n.by_movie;
  const row = el("div", "mz-row");
  row.style.paddingLeft = (depth * 14) + "px";
  const dot = el("i", "cd");
  dot.style.background = `rgb(${STATE_RGB[n.state] || STATE_RGB.none})`;
  dot.style.opacity = n.covered ? 1 : 0.25;
  dot.title = `${n.state === "none" ? "no C" : n.state || "?"} · ${n.covered ? "covered" : "not covered"}` + (by == null ? "" : by ? " · the selected replay reached it" : " · the selected replay did not");
  const a = el("a", "mono ell", n.name);
  a.href = "/fn/" + encodeURIComponent(n.name);
  const open = el("button", "ghost sm", dir === "up" ? "▴" : "▾");
  open.title = dir === "up" ? "its callers" : "its callees";
  let kids = null;
  open.onclick = async () => {
    if (kids) { kids.remove(); kids = null; return; }
    const c = await callsOf(n.name);
    if (!c) return;
    const list = dir === "up" ? c.callers : c.callees;
    kids = el("div", "mz-kids", ...(list.length ? list.slice(0, 60).map(x => nodeRow(x, dir, depth + 1)) : [el("div", "mono dim", "  none")]));
    wrap.append(kids);
  };
  const jump = el("button", "ghost sm", "◎");
  jump.title = "show in the maze";
  jump.onclick = () => { const i = MZ.data.byName.get(n.name); if (i != null) openCell(i); };
  row.append(dot, a, el("span", "mono dim", n.size != null ? `${n.size} B` : ""), el("span", "grow"), by === false ? el("span", "badge", "not in replay") : null, jump, open);
  wrap.append(row);
  return wrap;
}
async function openCell(i) {
  const d = MZ.data, c = d.flat[i];
  MZ.cell = i; drawMaze();
  const p = $("mzpanel");
  p.replaceChildren(el("div", "mono dim", "loading " + c.name));
  const k = await callsOf(c.name);
  if (MZ.cell !== i) return;
  const link = el("a", "mono", c.name);
  link.href = "/fn/" + encodeURIComponent(c.name);
  const title = el("div", "mz-title", link, badge(c.state === "none" ? "no C" : c.state, c.state === "exact" ? "ok" : c.state === "fuzzy" ? "warn" : "bad"),
    badge(`${c.size} B`), badge(c.hit ? "covered" : "never covered", c.hit ? "ok" : "bad"), el("span", "mono dim", c.mod));
  p.replaceChildren(el("h2", "", "Call tree"), title);
  if (!k || !k.graph) { p.append(el("div", "empty", "no static call graph for this function (the coverage ELF is not readable here)")); return; }
  p.append(el("div", "mono dim", `${k.callers.length} callers above, ${k.callees.length} callees below · ${k.path_kind} · per-run call stacks are not kept`));
  if (k.path.length > 1) p.append(el("div", "mz-path mono", "static path: " + k.path.join(" → ")));
  const list = (items, dir, none) => items.length ? items.slice(0, 80).map(n => nodeRow(n, dir, 0)) : [el("div", "mono dim", none)];
  p.append(el("div", "mz-side", el("div", "mz-h", "callers"), ...list(k.callers, "up", "none (a root, or reached only through a pointer)")),
    el("div", "mz-self mono", c.name), el("div", "mz-side", el("div", "mz-h", "callees"), ...list(k.callees, "down", "none")));
}
