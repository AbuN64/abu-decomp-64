<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAS</title>
<style>
  :root {
    --bg: #0d0e10; --panel: #131518; --line: #23262b; --hover: #1a1d21; --sel: #1d2a27;
    --fg: #d6d8db; --dim: #7a8089; --faint: #4a4f57;
    --ok: #6fb39f; --warn: #c8a24c; --bad: #d8705c;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .dim { color: var(--dim); } .faint { color: var(--faint); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 3px;
           padding: 3px 9px; cursor: pointer; }
  button:hover { background: var(--hover); }
  kbd { font: 11px var(--mono); color: var(--dim); }

  header { display: flex; align-items: center; gap: 14px; padding: 7px 12px; border-bottom: 1px solid var(--line);
           white-space: nowrap; min-height: 38px; }
  header .name { font-weight: 600; letter-spacing: .04em; }
  header .grow { flex: 1; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 30vw, 560px); }
  #left { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #right { display: flex; flex-direction: column; min-height: 0; }
  .head { display: flex; align-items: center; gap: 10px; padding: 6px 12px; color: var(--dim); font-size: 12px;
          border-bottom: 1px solid var(--line); white-space: nowrap; }
  .head b { color: var(--fg); font-weight: 500; }
  .head .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  #tiles { flex: none; min-height: 120px; padding: 10px 12px; display: grid; gap: 10px; align-content: start;
           justify-content: start; overflow: hidden; }
  #tiles .empty { color: var(--dim); align-self: center; }
  .tile { cursor: pointer; min-width: 0; }
  .tile canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; image-rendering: pixelated;
                 border: 1px solid var(--line); border-radius: 2px; }
  .tile:hover canvas { border-color: var(--faint); }
  .tile.sel canvas { border-color: var(--ok); }
  .tile.done canvas { opacity: .55; }
  .tile .cap { display: flex; gap: 6px; align-items: baseline; margin-top: 3px; height: 18px; overflow: hidden; }
  .tile .cap .mv { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tiles.small .tile .cnt { display: none; }
  .tile .bar { height: 2px; background: var(--line); margin-top: 2px; }
  .tile .bar i { display: block; height: 100%; background: var(--dim); }
  .tile .close { font: 13px var(--mono); line-height: 1; padding: 0 4px; border: 1px solid var(--line); border-radius: 2px;
                 color: var(--dim); background: none; cursor: pointer; }
  .tile .close:hover { color: var(--fg, #eee); border-color: var(--faint); }
  .badge { font: 11px var(--mono); padding: 0 4px; border: 1px solid var(--line); border-radius: 2px; color: var(--dim); }
  .badge.one { color: var(--ok); border-color: var(--ok); }

  #movies { flex: 1 1 0; min-height: 90px; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  #movies .scroll { flex: 1; min-height: 0; overflow: auto; }
  #coverage { flex: none; max-height: 40%; display: none; flex-direction: column; border-top: 1px solid var(--line); }
  #coverage .scroll { overflow: auto; min-height: 0; }
  #coverage .sum { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 6px 12px; font: 12px var(--mono); color: var(--dim); }
  #coverage .sum b { color: var(--fg); font-weight: 500; }
  #coverage .tabs { display: flex; gap: 6px; padding: 2px 12px 6px; }
  #coverage .tabs button.on { border-color: var(--ok); color: var(--ok); }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: var(--bg); text-align: left; font-weight: 400; color: var(--dim);
       font-size: 11px; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 4px 10px; border-bottom: 1px solid #181a1e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
       max-width: 260px; font-family: var(--mono); font-size: 12px; }
  td.name { font-family: inherit; font-size: 13px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  tbody tr.sel { background: var(--sel); }
  td.num, th.num { text-align: right; }

  #cycle { flex: 0 1 auto; max-height: 45%; display: flex; flex-direction: column; min-height: 0; }
  #lanes { overflow: auto; min-height: 0; flex: none; max-height: 60%; border-bottom: 1px solid var(--line); }
  #lanes .lane { padding: 5px 12px; border-bottom: 1px solid #181a1e; cursor: pointer; }
  #lanes .lane:hover { background: var(--hover); }
  #lanes .lane.sel { background: var(--sel); }
  #lanes .top { display: flex; gap: 8px; align-items: baseline; }
  #lanes .top .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lanes .st { display: flex; gap: 8px; font: 12px var(--mono); color: var(--dim); }
  #lanes .st span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font: 11px var(--mono); color: var(--warn); }
  #inbox { overflow: auto; min-height: 0; padding: 4px 0; }
  #inbox div { display: flex; gap: 8px; padding: 2px 12px; font: 12px var(--mono); }
  #inbox div span:last-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #inbox .mark { width: 62px; flex: none; }

  #console { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); position: relative; }
  #log { flex: 1; min-height: 0; overflow: auto; padding: 4px 0 8px; font: 12px/1.45 var(--mono); }
  #log div { display: flex; gap: 10px; padding: 0 12px; }
  #log .t { flex: none; text-align: right; color: var(--faint); user-select: none; }
  #log .x { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
  #latest { position: absolute; right: 16px; bottom: 12px; background: var(--panel); display: none; }
  #latest.on { display: block; }

  #stage { display: none; flex: none; padding: 10px 12px 4px; border-bottom: 1px solid var(--line); }
  #stage.on { display: block; }
  #stage .bar { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; white-space: nowrap; }
  #stage .bar .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #stage canvas { display: block; margin: 0 auto; background: #000; image-rendering: pixelated; border: 1px solid var(--line);
                  border-radius: 2px; outline: none; }
  #stage canvas.ctl { border-color: var(--ok); }
  #stage .hint { text-align: center; color: var(--dim); font-size: 12px; margin-top: 4px; }
  .tile .take { font: 11px var(--mono); padding: 0 5px; border: 1px solid var(--ok); color: var(--ok); border-radius: 2px;
                background: none; cursor: pointer; display: none; }
  .tile.sel .take.can { display: inline; }
  #compare { display: none; flex: none; padding: 8px 12px 6px; border-bottom: 1px solid var(--line); }
  #compare.on { display: block; }
  #compare .bar { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; white-space: nowrap; }
  #compare .bar .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #compare .pics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  #compare figure { margin: 0; min-width: 0; }
  #compare figure canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; image-rendering: pixelated;
                           border: 1px solid var(--line); border-radius: 2px; }
  #compare figcaption { font: 11px var(--mono); color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden;
                        text-overflow: ellipsis; }
  #cstrip { display: block; width: 100%; height: 34px; margin-top: 6px; cursor: crosshair; }
  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 0;
           min-width: 340px; max-width: min(720px, 92vw); }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog .dh { display: flex; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  dialog .dh b { flex: 1; font-weight: 600; }
  dialog .db { padding: 10px 14px 14px; }
  dialog .row { display: flex; gap: 14px; align-items: center; padding: 6px 0; }
  dialog .row > span:first-child { width: 90px; color: var(--dim); }
  dialog label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  dialog table td, dialog table th { max-width: none; }
  dialog h4 { margin: 12px 0 4px; font-weight: 500; color: var(--dim); font-size: 12px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    #left { border-right: 0; border-bottom: 1px solid var(--line); } .keys { display: none; } }
</style>
</head>
<body>
<header>
  <span class="name">TAS</span>
  <span id="build" class="mono dim"></span>
  <span class="grow"></span>
  <span id="conn" class="dim"></span>
  <span class="keys dim"><kbd>space</kbd> play 1x · <kbd>a</kbd> all · <kbd>x</kbd> stop · <kbd>↑↓</kbd>/click pick</span>
  <label id="pakwrap" class="dim" title="The next new run has the Expansion Pak (8 MB RDRAM); off is the 4 MB console"><input type="checkbox" id="pak" checked> Expansion Pak</label>
  <label id="cpakwrap" class="dim" title="The next new run has a Controller Pak (your save card, kept between runs); off is an empty slot"><input type="checkbox" id="cpak" checked> Controller Pak</label>
  <button id="newrun" title="Start your own run: fresh boot, your controller, recorded as a movie">new run</button>
  <button id="all" title="Replay every movie at turbo (a)">play all</button>
  <button id="clear" title="Stop every running replay and close every picture">close all</button>
  <button id="ctlbtn" title="Keyboard and gamepad map">controls</button>
  <button id="setbtn" title="Settings">settings</button>
</header>
<main>
  <section id="left">
    <div id="stage">
      <div class="bar"><b id="stitle"></b><span id="sinfo" class="grow mono dim"></span><span id="sstats" class="mono dim"></span>
        <button id="sctl" title="Send your keyboard / gamepad to this run">control</button>
        <button id="sstop" title="End this run; its polls are saved as a movie">stop</button>
        <button id="sclose" class="close" title="Close the big view">✕</button></div>
      <canvas id="scanvas" width="320" height="240" tabindex="0"></canvas>
      <div id="shint" class="hint"></div>
    </div>
    <div id="compare">
      <div class="bar"><b>port | original</b><span id="cinfo" class="grow mono dim"></span>
        <button id="clive" title="Follow the newest compared poll">latest</button></div>
      <div class="pics">
        <figure><canvas id="cport" width="320" height="240"></canvas><figcaption id="cportcap">port</figcaption></figure>
        <figure><canvas id="corig" width="320" height="240"></canvas><figcaption id="corigcap">original (recompiled ROM)</figcaption></figure>
        <figure><canvas id="cdiff" width="320" height="240"></canvas><figcaption>diff: red = visibly different pixels</figcaption></figure>
      </div>
      <canvas id="cstrip" width="960" height="34" title="share of the picture that differs, per compared poll (click a poll)"></canvas>
    </div>
    <div id="tiles"></div>
    <div id="movies">
      <div class="head"><b>movies</b><span id="mcount" class="grow"></span></div>
      <div class="scroll"><table>
        <thead><tr><th>movie</th><th>outcome</th><th>subject</th><th class="num">reached</th><th>twice</th><th>fn</th><th>train</th><th class="num" title="worst share of the picture that differed from the original (last run with the original)">vs orig</th><th class="num">last run</th></tr></thead>
        <tbody id="mbody"></tbody>
      </table></div>
    </div>
    <div id="coverage">
      <div class="head"><b>coverage</b><span id="cvhead" class="grow mono"></span><a id="cvfull" href="/coverage/" target="_blank" title="gcovr HTML report: every file and line, branch percentages, annotated source">full report</a></div>
      <div class="sum" id="cvsum"></div>
      <div class="tabs"><button id="cvt-oracle_only" title="The original reaches it, our port never does: a cycle ticket">oracle reaches, port never</button><button id="cvt-neither" title="No movie reaches it: record one">nobody reaches</button></div>
      <div class="scroll"><table>
        <thead><tr><th>function</th><th>file</th><th class="num">bytes</th><th>port</th><th>oracle</th></tr></thead>
        <tbody id="cvbody"></tbody>
      </table></div>
    </div>
  </section>
  <section id="right">
    <div id="cycle">
      <div class="head"><b>cycle lanes</b><span id="lcount" class="grow mono"></span></div>
      <div id="lanes"></div>
      <div class="head"><b>train inbox</b><span class="grow"></span></div>
      <div id="inbox"></div>
    </div>
    <div id="console">
      <div class="head"><b>console</b><span id="lrun" class="grow mono"></span></div>
      <div id="log"></div>
      <button id="latest">↓ latest</button>
    </div>
  </section>
</main>
<dialog id="settings">
  <div class="dh"><b>settings</b><button class="x" data-close>✕</button></div>
  <div class="db">
    <div class="row"><span>sound</span>
      <label><input type="radio" name="snd" value="on"> on (every run, turbo too)</label>
      <label><input type="radio" name="snd" value="off"> off</label></div>
    <div class="row"><span>which runs</span>
      <label><input type="radio" name="scope" value="all"> all running</label>
      <label><input type="radio" name="scope" value="focus"> focused run only</label></div>
    <div class="row"><span>sound from</span>
      <label><input type="radio" name="side" value="port"> the port</label>
      <label><input type="radio" name="side" value="oracle"> the original (runs started with original: on)</label></div>
    <div class="row"><span></span><span id="sndstate" class="dim"></span></div>
    <div class="row"><span>original</span>
      <label><input type="radio" name="orig" value="on"> on (each replay you start also runs the original game)</label>
      <label><input type="radio" name="orig" value="off"> off</label></div>
  </div>
</dialog>
<dialog id="controls">
  <div class="dh"><b>controls</b><button class="x" data-close>✕</button></div>
  <div class="db" id="ctlbody"></div>
</dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const FRAME_MS = 66, KEEP_DONE_S = 60, MAX_TILES = 16, MAX_LOG = 3000;

let S = null, skew = 0;          // last /api/state; server clock minus ours (seconds)
const sel = { movie: null, run: null, lane: null };
const now = () => Date.now() / 1000 + skew;
function ago(t) {
  if (t == null) return "—";
  const s = Math.max(0, Math.round(now() - t));
  return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.floor(s / 60)} m ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`;
}
const speedText = v => v === 0 ? "turbo" : `${v}x`;
const OUT = { ok: "ok", stop: "warn", crash: "bad", hang: "bad", exit: "dim" };
const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
  .then(r => r.json()).catch(() => ({}));

/* ---------- state ---------- */
async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    S = await r.json();
    skew = S.now - Date.now() / 1000;
    $("conn").textContent = ""; $("conn").className = "dim";
  } catch (e) {
    $("conn").textContent = "server unreachable"; $("conn").title = String(e); $("conn").className = "bad";
  }
  render();
  setTimeout(poll, S && S.runs.some(r => r.status === "running") ? 500 : 1000);
}
const runsOf = movie => S.runs.filter(r => r.movie === movie).sort((a, b) => b.started - a.started);
function selectedRun() {
  if (!S) return null;
  const byId = S.runs.find(r => r.id === sel.run);
  if (byId) return byId;
  if (sel.movie) return runsOf(sel.movie)[0] || null;
  const live = S.runs.filter(r => r.status === "running" && !closed.has(r.id)).sort((a, b) => b.started - a.started);
  return live[0] || null;
}
function select(movie, run) { sel.movie = movie; sel.run = run || null; render(); }

function render() {
  if (!S) return;
  const b = S.build || {};
  $("build").textContent = b.pin ? `${String(b.pin).slice(0, 9)} · built ${ago(b.built)}` : "no build";
  $("build").title = b.port || "";
  const h = humanRun();
  if (h && !P.id && P.closedId !== h.id) stageOn(h.id, false);  // a live-input run always gets the big view
  renderStage(); renderCompare(); renderTiles(); renderMovies(); renderLanes(); renderInbox(); followLog(); followAudio();
}

/* ---------- live tiles ---------- */
const closed = new Set();         // finished run ids the viewer closed with ✕
const tiles = new Map();          // run id -> {node, canvas, ctx, run, busy, last, got, timer}
function tileRuns() {
  const mine = r => !sel.lane || r.label === sel.lane;
  const live = S.runs.filter(r => r.status === "running" && !closed.has(r.id) && mine(r)).sort((a, b) => a.started - b.started);
  let done = S.runs.filter(r => r.status === "done" && !closed.has(r.id) && mine(r) && (now() - r.started < KEEP_DONE_S || sel.lane)).sort((a, b) => b.started - a.started);
  if (!live.length && !done.length) done = S.runs.filter(r => !closed.has(r.id) && mine(r)).slice().sort((a, b) => b.started - a.started).slice(0, 1);
  return live.concat(done).filter(r => r.id !== P.id).slice(0, MAX_TILES);
}
function makeTile(r) {
  const node = el("div", "tile"), canvas = el("canvas");
  canvas.width = 320; canvas.height = 240;
  const cap = el("div", "cap"), mv = el("span", "mv"), badge = el("span", "badge"), count = el("span", "cnt mono dim");
  const take = el("button", "take", "take");
  take.title = "take control: from the next poll this run follows your keyboard / gamepad (recorded)";
  take.onclick = e => { e.stopPropagation(); takeRun(t.run); };
  const close = el("button", "close", "✕");
  close.title = "stop this replay, or close it when finished";
  close.onclick = e => { e.stopPropagation(); closeRun(t.run); };
  cap.append(mv, badge, count, take, close);
  const bar = el("div", "bar"), fill = el("i"); bar.append(fill);
  node.append(canvas, cap, bar);
  const t = { node, canvas, ctx: canvas.getContext("2d"), mv, badge, count, fill, take, run: r, busy: false, got: false, misses: 0 };
  t.ctx.imageSmoothingEnabled = false;
  node.onclick = () => select(t.run.movie, t.run.id);  // select only: replays start from space, a or a row double-click
  return t;
}
// ✕: a running replay is stopped (its picture stays, dimmed, until closed); a finished one leaves the screen.
function closeRun(r) {
  if (r.status === "running") post("/api/stop", { id: r.id });
  else { closed.add(r.id); render(); }
}
function cpakText(c) { return !c || c === "none" || c === "fresh" ? c || "none" : c.slice(0, 8); }
function renderTiles() {
  const want = tileRuns(), box = $("tiles"), ids = new Set(want.map(r => r.id));
  for (const [id, t] of tiles) if (!ids.has(id)) { clearTimeout(t.timer); t.node.remove(); tiles.delete(id); }
  const cur = selectedRun();
  want.forEach((r, i) => {
    let t = tiles.get(r.id);
    if (!t) { t = makeTile(r); tiles.set(r.id, t); }
    const wasDone = t.run.status === "done";
    t.run = r;
    if (box.children[i] !== t.node) box.insertBefore(t.node, box.children[i] || null);
    t.mv.textContent = (r.label ? `[${r.label}] ` : "") + r.movie + ` · pak ${r.pak || "on"} · cpak ${cpakText(r.cpak)}`;
    t.mv.title = `${r.id}\n${r.port || ""}`;
    const out = r.status === "done" ? (r.outcome || "done") : null;
    t.badge.textContent = out || speedText(r.speed);
    t.badge.className = "badge" + (out ? " " + (OUT[out] || "dim") : r.speed === 1 ? " one" : "");
    t.count.textContent = `${r.poll}/${r.polls}`;
    t.count.className = "cnt mono dim";
    if (r.oracle && r.oracle.max_diff != null) {
      t.count.textContent += ` · Δ${pct(r.oracle.max_diff)}`;
      t.count.className = "cnt mono " + diffClass(r.oracle.max_diff);
      t.count.title = `worst poll differs ${pct(r.oracle.max_diff)} from the original (poll ${r.oracle.max_poll})`;
    }
    t.fill.style.width = r.polls ? `${Math.min(100, 100 * r.poll / r.polls)}%` : "0";
    t.node.classList.toggle("done", r.status === "done");
    t.take.classList.toggle("can", r.status === "running" && !humanRun());
    t.node.classList.toggle("sel", !!cur && cur.id === r.id);
    t.node.title = r.subject ? `${r.movie}: ${r.subject}` : r.movie;
    if (!t.busy && (r.status === "running" || !t.got || !wasDone)) frame(t);
  });
  const empty = box.querySelector(".empty");
  if (!want.length && !empty) box.append(el("div", "empty", "no replays yet · a plays every movie"));
  if (want.length && empty) empty.remove();
  fit();
}
// Load the next picture only after the previous one landed: at most one request in flight per tile, ~15 fps.
function frame(t) {
  if (!tiles.has(t.run.id)) return;
  t.busy = true;
  const started = performance.now(), img = new Image();
  img.onload = () => {
    t.ctx.drawImage(img, 0, 0, t.canvas.width, t.canvas.height);
    t.got = true; t.misses = 0; next(t, Math.max(0, FRAME_MS - (performance.now() - started)));
  };
  img.onerror = () => { t.misses++; next(t, t.misses > 20 ? 2000 : 400); };
  img.src = `/frame/${encodeURIComponent(t.run.id)}?n=${Date.now()}`;

// Size the tiles so every one fits the area at the largest 4:3 size (no page scroll).

  let best = 0, cols = 1;

/* ---------- live input: your own run ("new run") or a running replay taken over ("take"), in the big view ----------

  ["KeyX", "X", "A"], ["KeyC", "C", "B"], ["KeyZ", "Z", "Z"], ["Enter", "Enter", "START"], ["KeyA", "A", "L"], ["KeyS", "S", "R"],
  ["KeyI", "I", "CUP"], ["KeyK", "K", "CDOWN"], ["KeyJ", "J", "CLEFT"], ["KeyL", "L", "CRIGHT"],
  ["KeyT", "T", "UP"], ["KeyG", "G", "DOWN"], ["KeyF", "F", "LEFT"], ["KeyH", "H", "RIGHT"],

  [6, "LT", "Z"], [7, "RT", "Z"], [9, "Start", "START"], [12, "d-pad up", "UP"], [13, "d-pad down", "DOWN"], [14, "d-pad left", "LEFT"],
  [15, "d-pad right", "RIGHT"]];

  }
}
function median(v) { if (!v.length) return null; const s = v.slice().sort((a, b) => a - b); return s[s.length >> 1]; }
function renderStage() {
  const run = stageRun(), box = $("stage");
  box.classList.toggle("on", !!P.id);
  if (!P.id) return;
  const live = !!(run && run.status === "running");
  $("stitle").textContent = run ? (run.label ? `[${run.label}] ` : "") + run.movie + ` · pak ${run.pak || "on"} · cpak ${cpakText(run.cpak)}` : P.id;
  $("sinfo").textContent = !run ? "starting…" : live
    ? `poll ${run.poll}` + (run.input === "human" ? " · live input" : ` of ${run.polls} · ${speedText(run.speed)}`)
    : `${run.outcome || "done"}${run.subject ? " · " + run.subject : ""}${run.saved ? " · saved as " + run.saved : ""}`;
  $("sinfo").className = "grow mono " + (live || !run ? "dim" : OUT[run.outcome] || "dim");
  const n = P.frames.length, fps = n > 1 ? (n - 1) * 1000 / (P.frames[n - 1] - P.frames[0]) : 0, lat = median(P.lat);
  $("sstats").textContent = `${fps ? fps.toFixed(0) : "–"} fps · input→frame ${lat == null ? "–" : Math.round(lat) + " ms"}`;
  $("sstats").title = "pictures drawn per second here (last 2 s); median time from sending an input to drawing the first picture " +
    "the port made after applying it (last 30 inputs)";
  $("sctl").style.display = live && !P.control ? "" : "none";
  $("sstop").style.display = live ? "" : "none";
  $("scanvas").classList.toggle("ctl", live && P.control);
  $("shint").textContent = live
    ? (P.control ? "your keyboard and gamepad drive this run (see controls) · recorded, saved as a movie when it ends" : "control: drive this run")
    : run && run.saved ? `saved as movie ${run.saved} · replay: decomp tas play ${run.saved}` : "";
  const W = $("left").clientWidth - 24, H = Math.max(240, window.innerHeight * 0.62);
  const w = Math.max(320, Math.floor(Math.min(W, H * 4 / 3)));
  $("scanvas").style.width = `${w}px`; $("scanvas").style.height = `${Math.floor(w * 3 / 4)}px`;
}
$("newrun").onclick = newRun;
$("sctl").onclick = () => { const r = stageRun(); if (r && r.input === "human") stageOn(r.id, true); else if (r) takeRun(r); };
$("sstop").onclick = () => { if (P.id) post("/api/stop", { id: P.id }); };
$("sclose").onclick = () => {
  const r = stageRun();
  if (r && r.status === "running") return;
  P.closedId = P.id; P.id = null; P.loop++; renderStage(); render();
};
setInterval(() => { if (P.id) renderStage(); }, 500);
window.addEventListener("blur", () => { P.keys.clear(); sendPad(); });
document.addEventListener("keyup", e => { if (P.keys.delete(e.code)) { e.preventDefault(); sendPad(); } }, true);

/* ---------- the original game beside the port: shots at the same polls, scored poll by poll ---------- */
const O = { on: false, id: null, rows: [], every: 1, poll: null, follow: true, shown: "", busy: false, at: 0 };
try { O.on = localStorage.getItem("tas.oracle") === "on"; } catch (e) {}
document.querySelectorAll('#settings input[name="orig"]').forEach(i => i.onchange = () => {
  O.on = i.value === "on";
  try { localStorage.setItem("tas.oracle", O.on ? "on" : "off"); } catch (e) {}
});
const pct = v => v == null ? "—" : `${(100 * v).toFixed(v < 0.1 ? 1 : 0)}%`;
const diffClass = v => v == null ? "dim" : v < 0.05 ? "ok" : v < 0.25 ? "warn" : "bad";
function compareRun() { const r = selectedRun(); return r && r.oracle ? r : null; }
function renderCompare() {
  const r = compareRun(), box = $("compare");
  box.classList.toggle("on", !!r);
  if (!r) { O.id = null; return; }
  if (O.id !== r.id) Object.assign(O, { id: r.id, rows: [], poll: null, follow: true, shown: "", at: 0 });
  const o = r.oracle;
  if (!O.busy && (performance.now() - O.at > 1000 || !O.rows.length)) loadDiff(r.id);
  if (!O.rows.length) O.every = o.every || 1;
  const row = O.rows.find(x => x.poll === O.poll);
  const parts = [];
  parts.push(`original ${o.status === "running" ? "running" : o.outcome || "done"}${o.subject ? " (" + o.subject + ")" : ""} · poll ${o.poll}` +
    (o.fps ? ` · ${o.fps} polls/s` : ""));
  if (!O.follow && o.diff_poll != null) parts.push(`newest poll ${o.diff_poll}: ${pct(o.diff)}`);
  if (row) {
    parts.push(`poll ${row.poll}: ${pct(row.diff)} differs`);
    if (row.drift) parts.push(`DRIFT: the original matches ${Math.abs(row.drift)} polls ${row.drift > 0 ? "later" : "earlier"}`);
    if (row.vi_drift) parts.push(`VI ${row.vi_drift > 0 ? "+" : ""}${row.vi_drift}`);
  } else parts.push("no poll compared yet");
  if (o.max_diff != null) parts.push(`worst ${pct(o.max_diff)} at poll ${o.max_poll}`);
  $("cinfo").textContent = parts.join(" · ");
  $("cinfo").className = "grow mono " + (row && row.drift ? "warn" : row ? diffClass(row.diff) : "dim");
  $("cinfo").title = "diff = share of pixels whose colour differs visibly (32..64 of 255 or more) at the same poll; drift = the original's " +
    "picture a few polls away matches the port's clearly better (shown, never corrected); VI = retrace difference at that poll";
  $("clive").style.display = O.follow ? "none" : "";
  $("cportcap").textContent = row ? `port · poll ${row.poll}` : "port";
  $("corigcap").textContent = row ? `original · poll ${row.poll}` + (row.drift ? ` (best match: poll ${row.poll + row.drift})` : "") : "original (recompiled ROM)";
  drawStrip();
  if (row) showPoll(); else liveOriginal(r.id);
}
// Before any poll is compared, the original's latest picture (its own N64R_VIEW) stands in.
async function liveOriginal(id) {
  if (O.liveBusy) return;
  O.liveBusy = true; O.shown = "";
  try {
    const r = await fetch(`/oracle/${encodeURIComponent(id)}?n=${Date.now()}`, { cache: "no-store" });
    if (r.ok && O.id === id && !O.rows.length) {
      $("corig").getContext("2d").drawImage(await createImageBitmap(await r.blob()), 0, 0, 320, 240);
      $("corigcap").textContent = "original · latest picture";
    }
  } catch (e) {}
  setTimeout(() => { O.liveBusy = false; }, 250);
}
async function loadDiff(id) {
  O.busy = true; O.at = performance.now();
  try {
    const r = await fetch(`/diff/${encodeURIComponent(id)}`, { cache: "no-store" });
    if (r.ok && O.id === id) {
      const d = await r.json();
      O.rows = d.rows || []; O.every = d.every || 1;
      if (O.follow && O.rows.length) O.poll = O.rows[O.rows.length - 1].poll;
      renderCompare();
    }
  } catch (e) {}
  O.busy = false;
}
function drawStrip() {
  const c = $("cstrip"), w = c.clientWidth || 960, h = 34;
  if (c.width !== w) c.width = w;
  const g = c.getContext("2d"), css = getComputedStyle(document.documentElement);
  g.clearRect(0, 0, w, h);
  const r = compareRun();
  const last = Math.max(1, r ? r.polls : 1, ...O.rows.map(x => x.poll));
  const col = v => css.getPropertyValue(v < 0.05 ? "--ok" : v < 0.25 ? "--warn" : "--bad").trim();
  g.fillStyle = css.getPropertyValue("--line").trim(); g.fillRect(0, h - 1, w, 1);
  const bw = Math.max(1, Math.floor(w * O.every / last) - 1);
  for (const x of O.rows) {
    const px = Math.round((x.poll / last) * (w - bw)), bh = Math.max(1, Math.round(Math.min(1, x.diff * 2) * (h - 4)));
    g.fillStyle = col(x.diff); g.fillRect(px, h - 1 - bh, bw, bh);
    if (x.drift) { g.fillStyle = css.getPropertyValue("--warn").trim(); g.fillRect(px, 0, bw, 2); }
  }
  if (O.poll != null) { g.fillStyle = css.getPropertyValue("--fg").trim(); g.fillRect(Math.round((O.poll / last) * (w - bw)) + (bw >> 1), 0, 1, h); }
}
$("cstrip").onclick = e => {
  if (!O.rows.length) return;
  const r = compareRun(), c = $("cstrip"), last = Math.max(1, r ? r.polls : 1, ...O.rows.map(x => x.poll));
  const at = (e.offsetX / c.clientWidth) * last;
  O.poll = O.rows.reduce((a, b) => Math.abs(b.poll - at) < Math.abs(a.poll - at) ? b : a).poll;
  O.follow = O.poll === O.rows[O.rows.length - 1].poll;
  renderCompare();
};
$("clive").onclick = () => { O.follow = true; if (O.rows.length) O.poll = O.rows[O.rows.length - 1].poll; renderCompare(); };
async function showPoll() {
  const key = `${O.id} ${O.poll}`;
  if (O.poll == null || key === O.shown) return;
  O.shown = key;
  const load = side => fetch(`/shot/${encodeURIComponent(O.id)}?side=${side}&poll=${O.poll}`, { cache: "no-store" })
    .then(r => r.ok ? r.blob() : null).then(b => b ? createImageBitmap(b) : null).catch(() => null);
  const [a, b] = await Promise.all([load("port"), load("oracle")]);
  if (key !== O.shown) return;
  const pa = $("cport").getContext("2d"), pb = $("corig").getContext("2d"), pd = $("cdiff").getContext("2d");
  for (const [g, img] of [[pa, a], [pb, b]]) { g.fillStyle = "#000"; g.fillRect(0, 0, 320, 240); if (img) g.drawImage(img, 0, 0); }
  if (!a || !b) { pd.fillStyle = "#000"; pd.fillRect(0, 0, 320, 240); return; }
  // The same test the server scores with: a channel in another 64-wide bucket on both grids (offset by 32).
  const da = pa.getImageData(0, 0, 320, 240).data, db = pb.getImageData(0, 0, 320, 240).data, out = pd.createImageData(320, 240);
  for (let i = 0; i < da.length; i += 4) {
    let differs = false;
    for (let c = 0; c < 3 && !differs; c++) differs = (da[i + c] >> 6) !== (db[i + c] >> 6) && ((da[i + c] + 32) >> 6) !== ((db[i + c] + 32) >> 6);
    const grey = (da[i] + da[i + 1] + da[i + 2]) / 9;
    out.data[i] = differs ? 230 : grey; out.data[i + 1] = differs ? 60 : grey; out.data[i + 2] = differs ? 50 : grey; out.data[i + 3] = 255;
  }
  pd.putImageData(out, 0, 0);
}

/* ---------- modals: settings (sound) and controls (key map) ---------- */
function openModal(id) {
  if (id === "settings") {
    document.querySelector(`#settings input[name="snd"][value="${A.on ? "on" : "off"}"]`).checked = true;
    document.querySelector(`#settings input[name="scope"][value="${A.scope}"]`).checked = true;
    document.querySelector(`#settings input[name="side"][value="${A.side}"]`).checked = true;
    document.querySelector(`#settings input[name="orig"][value="${O.on ? "on" : "off"}"]`).checked = true;
    soundLabel();
  }
  $(id).showModal();
}
function renderControls() {
  const tbl = (head, rows) => {
    const t = el("table"), h = el("tr");
    head.forEach(x => h.append(el("th", "", x))); t.append(h);
    rows.forEach(r => { const tr = el("tr"); r.forEach((x, i) => tr.append(el("td", i ? "" : "mono", x))); t.append(tr); });
    return t;
  };
  $("ctlbody").replaceChildren(
    el("h4", "", "keyboard (while you control a run)"), tbl(["key", "N64"], KEYS.map(([, k, w]) => [k, w])),
    el("h4", "", "gamepad (standard layout)"),
    tbl(["button", "N64"], PAD_BUTTONS.map(([, k, w]) => [k, w]).concat([["left stick", "stick"], ["right stick", "C buttons"]])),
    el("h4", "", "page keys (when not controlling a run)"),
    tbl(["key", "does"], [["space", "replay the selected movie at 1x"], ["a", "replay every movie at turbo"],
      ["x", "stop the selected run"], ["↑ ↓", "pick a movie"]]));
}
renderControls();
$("ctlbtn").onclick = () => openModal("controls");
$("setbtn").onclick = () => openModal("settings");
document.querySelectorAll("dialog [data-close]").forEach(b => { b.onclick = () => b.closest("dialog").close(); });
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

/* ---------- actions ---------- */
async function play(movie, speed) {
  if (!movie) return;
  wake();
  const r = await post("/api/play", { movie, speed, oracle: O.on });
  if (r.error) alert(r.error);
  select(movie, r.id || null);
}
$("all").onclick = () => post("/api/play-all", {});
$("clear").onclick = () => {
  for (const r of S ? S.runs : []) {
    if (r.id === P.id) continue;   // your own live run stays (stop it in the big view)
    if (r.status === "running") post("/api/stop", { id: r.id });
    closed.add(r.id);
  }
  render();
};
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (controlling() && KEYS.some(k => k[0] === e.code)) { e.preventDefault(); P.keys.add(e.code); sendPad(); return; }
  if (document.querySelector("dialog[open]")) return;
  if (e.key === " ") { e.preventDefault(); const r = selectedRun(); play(sel.movie || (r && r.movie), 1); }
  else if (e.key === "a") post("/api/play-all", {});
  else if (e.key === "x") { const r = selectedRun(); if (r && r.status === "running") post("/api/stop", { id: r.id }); }
  else if (e.key === "ArrowDown") { e.preventDefault(); moveSel(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-1); }
});
document.addEventListener("click", e => { if (e.target.tagName === "BUTTON") e.target.blur(); });
poll();
</script>
