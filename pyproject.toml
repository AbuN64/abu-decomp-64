[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abu-decomp-64"
version = "0.1.0"
description = "The N64 decompilation dev cycle and its seat over unbake, Recipe Maker and Cake Taste"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
requires-python = ">=3.13"
# Direct pins by commit. `decomp dependencies` reads these lines from the installed metadata and checks
# each installed tool against them, so this table is the only place a pin is written.
dependencies = [
  "textual==8.2.8",
  "unbake @ git+https://github.com/AbuN64/cake-unbake-64@4f15842476af1a72364b77abceff88270b61d27a",
  "recipemaker @ git+https://github.com/AbuN64/recipe-maker-64@c1e8ec8101fe8807caa6dc0c6a68682b115d419b",
  "cake-taste-64 @ git+https://github.com/AbuN64/cake-taste-64@c3aeece23f8c96696a74a0a12d89ad53fd3b4c8f",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9"]

[project.scripts]
decomp = "abu_decomp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abu_decomp", "abu_decomp.*"]

[tool.setuptools.package-data]
"abu_decomp.port" = ["template/**/*", "template/**/.*"]
"abu_decomp.stream" = ["input_bridge.c", "INPUT.md", "protocols/*.xml"]
"abu_decomp.build" = ["SCHEMA.md"]
"abu_decomp" = ["tas_page.html"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# The lane runner and steer are hand moves of the orchestration scripts; their style rules wait for a rewrite.
[tool.ruff.lint.per-file-ignores]
"src/abu_decomp/lanes/{runner,steer}.py" = ["E401", "E402", "E501", "E741", "I001", "RUF005", "RUF059", "SIM105", "SIM108", "SIM115", "UP017", "UP031"]
