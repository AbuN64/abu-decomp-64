[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abu-decomp-64"
version = "0.1.0"
description = "The N64 decompilation dev cycle and its seat over unbake, Recipe Maker and Cake Taste"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
requires-python = ">=3.13"
# Direct pins by commit. `decomp dependencies` reads these lines from the installed metadata and checks
# each installed tool against them, so this table is the only place a pin is written.
dependencies = [
  "textual==8.2.8",
  "pycparser==3.0",
  "gcovr==8.3",
  "pillow==13.0.0",  # shared capture decoder + bounded JPEG video for the TAS viewer
  "unbake @ git+https://github.com/AbuN64/cake-unbake-64@d77dcea3fd17292678b5f7b9abf1f57419f0adc2",
  "recipemaker @ git+https://github.com/AbuN64/recipe-maker-64@89ef04dbdaabd4c64a7b8ca2e1a769d8678f0272",
  "cake-taste-64 @ git+https://github.com/AbuN64/cake-taste-64@307bf39c91b8c6c542a5bfee9c36ffcc3a7f7d9a",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "pytest==9.1.1", "numpy==2.2.4"]  # numpy: the shim boot tests (shim/boot/fl0.py)

[project.scripts]
decomp = "abu_decomp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abu_decomp", "abu_decomp.*"]

[tool.setuptools.package-data]
"abu_decomp.port" = ["template/**/*", "template/**/.*"]
"abu_decomp.build" = ["SCHEMA.md"]
"abu_decomp" = ["tas_page.html", "tas_fn.html"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# The lane runner and steer are hand moves of the orchestration scripts; their style rules wait for a rewrite.
[tool.ruff.lint.per-file-ignores]
"src/abu_decomp/data/*.py" = ["E501", "UP031"]  # report rows and evidence strings read better unwrapped
"tests/test_data_*.py" = ["E501"]
"src/abu_decomp/lanes/{runner,steer}.py" = ["E401", "E402", "E501", "E741", "I001", "RUF005", "RUF059", "SIM105", "SIM108", "SIM115", "UP017", "UP031"]
