[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abu-decomp-64"
version = "0.1.0"
description = "The N64 decompilation dev cycle and its seat over unbake, Recipe Maker and Cake Taste"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
requires-python = ">=3.13"
# Direct pins by commit. `decomp dependencies` reads these lines from the installed metadata and checks
# each installed tool against them, so this table is the only place a pin is written.
dependencies = [
  "textual==8.2.8",
  "gcovr==8.3",
  "unbake @ git+https://github.com/AbuN64/cake-unbake-64@539b5bc94795ed3c80082419c3cfd08300d5aa0a",
  "recipemaker @ git+https://github.com/AbuN64/recipe-maker-64@c582ea6fb404a6def350a3dd284a2386bacb6a5c",
  "cake-taste-64 @ git+https://github.com/AbuN64/cake-taste-64@112844e2ce02dd3f2478a634174287300d27c580",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "pytest==9.1.1", "numpy==2.2.4"]  # numpy: the shim boot tests (shim/boot/fl0.py)

[project.scripts]
decomp = "abu_decomp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abu_decomp", "abu_decomp.*"]

[tool.setuptools.package-data]
"abu_decomp.port" = ["template/**/*", "template/**/.*"]
"abu_decomp.build" = ["SCHEMA.md"]
"abu_decomp" = ["tas_page.html"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# The lane runner and steer are hand moves of the orchestration scripts; their style rules wait for a rewrite.
[tool.ruff.lint.per-file-ignores]
"src/abu_decomp/lanes/{runner,steer}.py" = ["E401", "E402", "E501", "E741", "I001", "RUF005", "RUF059", "SIM105", "SIM108", "SIM115", "UP017", "UP031"]
