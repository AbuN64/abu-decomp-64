[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abu-decomp-64"
version = "0.1.0"
description = "The N64 decompilation dev cycle and its seat over unbake, Recipe Maker and Cake Taste"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
requires-python = ">=3.13"
# Direct pins by commit. `decomp dependencies` reads these lines from the installed metadata and checks
# each installed tool against them, so this table is the only place a pin is written.
dependencies = [
  "textual==8.2.8",
  "pycparser==3.0",
  "gcovr==8.3",
  "pillow==13.0.0",  # shared capture decoder + bounded JPEG video for the TAS viewer
  "unbake @ git+https://github.com/AbuN64/cake-unbake-64@b1406afc0f933313fe665b15746e7fe8eea95c05",
  "recipemaker @ git+https://github.com/AbuN64/recipe-maker-64@8615eed5e25dc25b524024fd7f9f891c893558de",
  "cake-taste-64 @ git+https://github.com/AbuN64/cake-taste-64@a9afb02e6e33c3761feb5363a16eef6dcc0be2f8",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "pytest==9.1.1", "numpy==2.2.4"]  # numpy: the shim boot tests (shim/boot/fl0.py)

[project.scripts]
decomp = "abu_decomp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abu_decomp", "abu_decomp.*"]

# The port template (dot-dirs and .gitkeep included) ships through MANIFEST.in: setuptools package-data globs skip dot-files.
[tool.setuptools.package-data]
"abu_decomp.build" = ["SCHEMA.md"]
"abu_decomp" = ["runner.html", "static/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]  # a bare pytest imports this tree, never the venv copy
testpaths = ["tests"]  # shim/boot/test_*.py are scripts that parse argv on import: a bare pytest must not collect them

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/abu_decomp/data/*.py" = ["E501", "UP031"]  # report rows and evidence strings read better unwrapped
"tests/test_data_*.py" = ["E501"]
